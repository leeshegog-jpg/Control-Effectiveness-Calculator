<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>VRTP OHS Command Centre</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1E3A8A; --navy-dark:#1F3864; --blue:#2563EB; --blue-light:#EFF6FF;
  --gray-50:#F9FAFB; --gray-100:#F3F4F6; --gray-200:#E5E7EB; --gray-400:#9CA3AF;
  --gray-600:#4B5563; --gray-800:#1F2937;
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--gray-800); background:var(--gray-100);
  display:flex; flex-direction:column; height:100vh; overflow:hidden;
}
/* ── Header ── */
.cc-header{
  background:var(--navy); color:#fff; padding:12px 22px;
  display:flex; align-items:center; gap:14px; flex-shrink:0;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.cc-header .logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;white-space:nowrap}
.cc-header .tagline{opacity:.8;font-size:12.5px;border-left:1px solid rgba(255,255,255,.25);padding-left:14px}
.cc-header .spacer{flex:1}
.cc-header .open-ext{
  color:#fff;font-size:12px;font-weight:600;text-decoration:none;
  background:rgba(255,255,255,.12);padding:6px 12px;border-radius:6px;
  display:inline-flex;align-items:center;gap:6px;transition:background .15s;white-space:nowrap;
}
.cc-header .open-ext:hover{background:rgba(255,255,255,.24)}
/* ── Tab nav ── */
.cc-nav{
  background:var(--navy-dark); display:flex; align-items:stretch;
  padding:0 12px; gap:2px; flex-shrink:0; overflow-x:auto;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.cc-tab{
  appearance:none; background:none; border:none; cursor:pointer;
  color:rgba(255,255,255,.62); font-size:13px; font-weight:600;
  padding:12px 18px; display:inline-flex; align-items:center; gap:7px;
  border-bottom:3px solid transparent; white-space:nowrap;
  transition:color .15s,border-color .15s,background .15s; font-family:inherit;
}
.cc-tab:hover{color:#fff;background:rgba(255,255,255,.05)}
.cc-tab.active{color:#fff;border-bottom-color:#60A5FA}
.cc-tab .ico{font-size:15px}
/* ── Frame stage ── */
.cc-stage{position:relative;flex:1;background:var(--gray-50)}
.cc-frame{
  position:absolute;inset:0;width:100%;height:100%;border:0;
  background:#fff;display:none;
}
.cc-frame.active{display:block}
.cc-loading{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;color:var(--gray-400);font-size:13px;
}
.cc-loading.show{display:flex}
.cc-spinner{
  width:34px;height:34px;border:3px solid var(--gray-200);border-top-color:var(--blue);
  border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
/* ── Placeholder for missing files ── */
.cc-missing{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:10px;color:var(--gray-600);padding:40px;text-align:center;
}
.cc-missing.show{display:flex}
.cc-missing .big{font-size:38px;opacity:.4}
.cc-missing code{background:var(--gray-100);padding:2px 7px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<header class="cc-header">
  <div class="logo">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    <span>VRTP OHS Command Centre</span>
  </div>
  <div class="tagline">Unified safety, risk &amp; incident tools</div>
  <div class="spacer"></div>
  <a class="open-ext" id="openExt" href="#" target="_blank" rel="noopener">↗ Open current tool in new window</a>
</header>

<nav class="cc-nav" id="ccNav"></nav>

<div class="cc-stage" id="ccStage">
  <div class="cc-loading" id="ccLoading"><div class="cc-spinner"></div><div id="ccLoadingLabel">Loading…</div></div>
  <div class="cc-missing" id="ccMissing">
    <div class="big">🚫</div>
    <div><strong>Tool not found</strong></div>
    <div>Expected file <code id="ccMissingPath"></code> is missing from this folder.</div>
  </div>
</div>

<script>
/* Each tool = one iframe, lazily loaded on first activation.
   SMS Hub points at the repo-root suite (this folder lives inside the
   TP_Risk_Management_SMS repo, so the hub is one level up). */
const TOOLS = [
  { id:'hub',       label:'SMS Hub',          ico:'🛡️', src:'../index.html' },
  { id:'hazard',    label:'Hazard Register',  ico:'⚠️', src:'hazard_register.html' },
  { id:'incident',  label:'Incident Report',  ico:'🔴', src:'incident_report.html' },
  { id:'dashboard', label:'Safety Dashboard', ico:'📊', src:'safety_dashboard.html' },
  { id:'import',    label:'Import Reference', ico:'📋', src:'ohs_import_reference.html' },
];

const nav=document.getElementById('ccNav');
const stage=document.getElementById('ccStage');
const loading=document.getElementById('ccLoading');
const loadingLabel=document.getElementById('ccLoadingLabel');
const missing=document.getElementById('ccMissing');
const missingPath=document.getElementById('ccMissingPath');
const openExt=document.getElementById('openExt');
const frames={}; const tabs={}; let current=null;

TOOLS.forEach(t=>{
  const btn=document.createElement('button');
  btn.className='cc-tab'; btn.innerHTML=`<span class="ico">${t.ico}</span>${t.label}`;
  btn.onclick=()=>activate(t.id);
  nav.appendChild(btn); tabs[t.id]=btn;
});

function activate(id){
  const tool=TOOLS.find(t=>t.id===id);
  if(!tool) return;
  current=id;
  Object.values(tabs).forEach(b=>b.classList.remove('active'));
  tabs[id].classList.add('active');
  openExt.href=tool.src;
  missing.classList.remove('show');

  // hide all frames
  Object.values(frames).forEach(f=>f.classList.remove('active'));

  if(!frames[id]){
    // lazy create + load
    const f=document.createElement('iframe');
    f.className='cc-frame'; f.title=tool.label;
    loading.classList.add('show'); loadingLabel.textContent='Loading '+tool.label+'…';
    f.addEventListener('load',()=>{
      loading.classList.remove('show');
      // detect broken local load (blank about:blank stays); best-effort only
    });
    f.addEventListener('error',()=>{
      loading.classList.remove('show');
      missingPath.textContent=tool.src; missing.classList.add('show');
    });
    f.src=tool.src;
    stage.appendChild(f); frames[id]=f;
  }
  frames[id].classList.add('active');
}

// deep-link support: #hazard etc.
const initial=(location.hash||'').replace('#','');
activate(TOOLS.some(t=>t.id===initial)?initial:'hub');
window.addEventListener('hashchange',()=>{
  const h=(location.hash||'').replace('#','');
  if(TOOLS.some(t=>t.id===h)&&h!==current) activate(h);
});
</script>
</body>
</html>
