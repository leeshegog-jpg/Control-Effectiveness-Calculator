<script>
window.storage = {
  get: async (key) => { const v = localStorage.getItem("gohs__" + key); return v ? { key, value: v } : null; },
  set: async (key, value) => { localStorage.setItem("gohs__" + key, value); return { key, value }; },
  delete: async (key) => { localStorage.removeItem("gohs__" + key); return { key, deleted: true }; }
};

// ─── IndexedDB for folder handles ────────────────────────────────────────────
window.folderDB = (() => {
  let db = null;
  const open = () => new Promise((res, rej) => {
    if (db) return res(db);
    const req = indexedDB.open("gohs-folders", 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore("folders", { keyPath: "ride" });
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror = () => rej(req.error);
  });
  const tx = async (mode, fn) => { const d = await open(); return new Promise((res,rej)=>{ const t=d.transaction("folders",mode); const s=t.objectStore("folders"); const r=fn(s); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); };
  return {
    getAll: async () => { const d = await open(); return new Promise((res,rej)=>{ const t=d.transaction("folders","readonly"); const s=t.objectStore("folders"); const r=s.getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
    put: (rec) => tx("readwrite", s => s.put(rec)),
    delete: (ride) => tx("readwrite", s => s.delete(ride)),
  };
})();
// pdf.js worker
if (window.pdfjsLib) {

// ─── HELPERS ──────────────────────────────────────────────────────────────────
// Snap any AI-generated category string to the nearest valid CATEGORIES value
const normalizeCategory = (raw) => {
  if (!raw) return "Operational";
  const s = String(raw).toLowerCase().trim();
  if (/structural/.test(s) && /mechanical/.test(s)) return "Mechanical";
  if (/mechanical|wire.?rope|bearing|gearbox|pulley|wheel|track|brake|restraint|lap.?bar|harness|gondola|chain|winch|hydraulic.?cyl|actuator|pump.?fail/.test(s)) return "Mechanical";
  if (/structural|timber|corros|fatigue|weld|fastenr|bolt|crack|settlement|subsidence/.test(s)) return "Structural";
  if (/electric|plc|sensor|control.?system|software|wiring|earthing|bonding|lighting|power.?loss/.test(s)) return "Electrical";
  if (/hydraulic|pneumatic|water.?flow|pump|valve|flume|hose.?rupture|fluid/.test(s)) return "Water/Hydraulics";
  if (/mainten|loto|isolat|inspection|defect|cmms|work.?order|service/.test(s)) return "Maintenance";
  if (/fire|evacuat|emergenc|rescue/.test(s)) return "Fire/Emergency";
  if (/environ|weather|wind|lightning|rain|heat|uv|temperature/.test(s)) return "Environmental";
  if (/crowd|queue|access|unauthor|public|patron.?behav/.test(s)) return "Crowd Management";
  if (/human.?factor|train|competen|fatigue|distract|communic|procedur|supervis/.test(s)) return "Human Factors";
  if (/operat|dispatch|boarding|staffing|rider|guest|load|unload/.test(s)) return "Operational";
  // Last resort: exact match or default
  const exact = CATEGORIES.find(c => c.toLowerCase() === s);
  return exact || "Operational";
};

const normalizeControl = (c) => {
  if (typeof c === 'string') {
    const isCritical = c.includes('CRITICAL CONTROL');
    const hm = c.match(/\((Engineering|Administrative|PPE|Isolation|Substitution|Elimination)\)/i);
    const sm = c.match(/\[([^\]]+)\]/);
    const desc = c.replace(/\s*\(CRITICAL CONTROL\)\s*/gi,'').trim();
    return { description: desc, isCritical, hierarchy: hm?hm[1]:'Administrative', accountability:'', frequency:'', parameters:'', evidence:'', escalation:'', standard: sm?sm[1]:'' };
  }
  return { description:'', isCritical:false, hierarchy:'Administrative', accountability:'', frequency:'', parameters:'', evidence:'', escalation:'', standard:'', ...c };
};

const normalizeEntry = (e) => ({
  riskTitle: '', inherentConsequenceJustification: '', inherentLikelihoodJustification: '',
  sfarpJustification: '', riskReductionJustification: '',
  device: '', park: '', isCommon: false,
  ...e,
  category: normalizeCategory(e.category),
  controls: (e.controls||[]).map(c => {
    const nc = normalizeControl(c);
    return { controlType:'Prevention', effectiveness:3, ...nc };
  })
});

const parseAndSalvage = (raw) => {
  let s = raw.replace(/```json[\s\S]*?```|```/g,"").trim();
  // Strip control chars that break JSON (but keep \n \r \t which JSON handles)
  s = s.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/g, ' ');
  if (!s.startsWith("[")) { const i=s.indexOf("["); s=i>=0?s.slice(i):"["+s; }
  // Find the last complete object, close the array
  if (!s.endsWith("]")) { const i=s.lastIndexOf("}"); s=i>=0?s.slice(0,i+1)+"]":s+"]"; }
  try { return JSON.parse(s); } catch(e1) {
    // Try fixing unescaped newlines inside JSON string values
    try {
      const fixed = s.replace(/"([^"\\]*(\\.[^"\\]*)*)"/gs, (m) =>
        m.replace(/\n/g,'\\n').replace(/\r/g,'\\r').replace(/\t/g,'\\t'));
      return JSON.parse(fixed);
    } catch(e2) {
      // Last resort: extract individual objects
      const objects = [];
      const re = /\{[\s\S]*?\}(?=\s*[,\]])/g;
      let match;
      while ((match = re.exec(s)) !== null) {
        try { objects.push(JSON.parse(match[0])); } catch {}
      }
      if (objects.length > 0) return objects;
      throw new Error("JSON parse failed after all recovery attempts. " + e1.message);
    }
  }
};

const callAPI = async (apiKey, system, userMsg, maxTokens=4000) => {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:maxTokens,system,messages:[{role:"user",content:userMsg}]})
  });
  if (!res.ok) throw new Error(`API ${res.status}: ${await res.text()}`);
  const data = await res.json();
  return data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
};

const genBatch = async (hazardText, runningBase, apiKey, extraContext) => {
  const ctx = extraContext ? `\n\nContext for this register:\n${extraContext}` : "";
  const raw = await callAPI(apiKey, SYSTEM_PROMPT,
    `For EACH hazard listed, generate one complete hazard register entry. Return ONLY a valid JSON array. No preamble, no markdown fences. IMPORTANT: All string values must be properly JSON-escaped — no literal newlines, tabs, or unescaped quotes inside strings.${ctx}\n\nHazards:\n${hazardText}`);
  const arr = parseAndSalvage(raw);
  // Filter out skeleton objects that survived JSON recovery but have no real content
  const valid = arr.filter(e => e && typeof e.hazard === 'string' && e.hazard.trim().length > 5);
  return valid.map((e,i)=>normalizeEntry({
    consequence: 1, likelihood: 1,  // safe defaults so rating never shows NaN
    ...e,
    id:`H-${String(runningBase+i+1).padStart(3,"0")}`
  }));
};

const parseAndSalvageBoundaryObject = (raw) => {
  let s = raw.replace(/```json|```/g,"").trim();
  s = s.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/g, ' ');
  const start = s.indexOf('{');
  if (start < 0) throw new Error("No JSON object found in response");
  s = s.slice(start);
  // Try direct parse
  try { return JSON.parse(s); } catch {}
  // Properly track parser state to find last safe cut point
  let inStr = false, esc = false, objDepth = 0, arrDepth = 0, lastTopComma = -1;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (esc) { esc = false; continue; }
    if (ch === '\\' && inStr) { esc = true; continue; }
    if (ch === '"') { inStr = !inStr; continue; }
    if (inStr) continue;
    if (ch === '{') objDepth++;
    else if (ch === '}') objDepth--;
    else if (ch === '[') arrDepth++;
    else if (ch === ']') arrDepth--;
    else if (ch === ',' && objDepth === 1 && arrDepth === 0) lastTopComma = i;
  }
  // Cut at last top-level comma and close
  const cutAt = lastTopComma > 0 ? lastTopComma : s.lastIndexOf('}');
  if (cutAt > 0) {
    let cut = s.slice(0, cutAt);
    // Recount depths for closing
    let od = 0, ad = 0; inStr = false; esc = false;
    for (const ch of cut) {
      if (esc) { esc = false; continue; }
      if (ch === '\\' && inStr) { esc = true; continue; }
      if (ch === '"') { inStr = !inStr; continue; }
      if (inStr) continue;
      if (ch === '{') od++; else if (ch === '}') od--;
      else if (ch === '[') ad++; else if (ch === ']') ad--;
    }
    cut += ']'.repeat(Math.max(0,ad)) + '}'.repeat(Math.max(0,od));
    try { return JSON.parse(cut); } catch {}
    // Last resort: fix unescaped newlines inside strings
    try {
      const fixed = cut.replace(/"((?:[^"\\]|\\.)*)"/gs,
        (_,g) => '"'+g.replace(/\n/g,'\\n').replace(/\r/g,'\\r').replace(/\t/g,'\\t')+'"');
      return JSON.parse(fixed);
    } catch {}
  }
  throw new Error("Boundary report JSON unrecoverable — try again");
};

  }
  const data = await res.json();
  const text = data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
  if (!text) throw new Error(`Empty response (stop_reason: ${data.stop_reason})`);
  return text;
};

const generateBoundaryReport = async (deviceName, docs, apiKey, extraCtx) => {
  const cleanDoc = (text) => text.replace(/[\r\n\t]+/g,' ').replace(/[""]/g,'"').replace(/['']/g,"'").replace(/\s+/g,' ').trim();
  const docContext = docs.length>0
    ? `\n\nDevice documentation extracts:\n${docs.map(d=>`[${d.name}]: ${cleanDoc(d.text).slice(0,600)}`).join('\n')}`
    : '';
  const msg = `Generate a Device Boundary and Summary Report for: ${deviceName}${extraCtx?`\n\nAdditional context: ${extraCtx}`:''}${docContext}\n\nReturn ONLY valid JSON. Each string value max 150 chars. Each array max 5 items.`;
  const raw = await callAPIHighOutput(apiKey, BOUNDARY_SYSTEM_PROMPT, msg, 8000);
  const first300 = raw.slice(0,300).replace(/\n/g,' ');
  if (!raw.includes('{')) throw new Error(`API returned no JSON. Raw: "${first300}"`);
  return parseAndSalvageBoundaryObject(raw);
};

const generateLibrarySuggestions = async (newDevice, libraryEntries, apiKey) => {
  const lib = libraryEntries.map(e=>`${e.id}: ${e.hazard} — ${e.risk}`).join('\n');
  const msg = `I have a hazard library with these entries:\n${lib}\n\nNew device: "${newDevice}"\n\nWhich library entries are likely applicable to this new device? Return a JSON array of {id, reason} objects for applicable entries only. No preamble.`;
  const raw = await callAPI(apiKey,
    `You are a WHS expert for VRTP amusement devices. Analyse a hazard library and identify entries applicable to a new device.`,
    msg, 2000);
  const s = raw.replace(/```json|```/g,'').trim();
  const i = s.indexOf('['), j = s.lastIndexOf(']');
  return JSON.parse(s.slice(i, j+1));
};

const extractPDF = async (file) => {
  if (!window.pdfjsLib) throw new Error('pdf.js not loaded');
  const ab = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data: ab}).promise;
  let text = '';
  for (let i=1; i<=pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(item=>item.str).join(' ') + '\n';
  }
  return text;
};

const extractDOCX = async (file) => {
  if (!window.mammoth) throw new Error('mammoth.js not loaded');
  const ab = await file.arrayBuffer();
  const result = await window.mammoth.extractRawText({arrayBuffer: ab});
  return result.value;
};

// ─── Folder helpers ───────────────────────────────────────────────────────────
const extractFileText = async (file) => {
  const n = file.name.toLowerCase();
  if (n.endsWith('.pdf')) return extractPDF(file);
  if (n.endsWith('.docx') || n.endsWith('.doc')) return extractDOCX(file);
  return file.text();
};

const SUPPORTED_EXT = ['.pdf','.docx','.doc','.txt','.md'];
const isSupportedFile = (name) => SUPPORTED_EXT.some(e => name.toLowerCase().endsWith(e));

// Read all supported files from a folder handle, return [{name, text, size}]
// If a .md file exists for a PDF/DOCX, the .md is used and the original is skipped
// (run convert_docs.py with markitdown to pre-convert your PDFs for best results)
const readFolderDocs = async (dirHandle, onProgress) => {
  // First pass: catalogue all files
  const allEntries = [];
  const mdBasenames = new Set(); // base names (no ext) that have a .md file
  for await (const entry of dirHandle.values()) {
    if (entry.kind !== 'file') continue;
    allEntries.push(entry);
    if (entry.name.toLowerCase().endsWith('.md')) {
      mdBasenames.add(entry.name.toLowerCase().slice(0, -3));
    }
  }
  // Second pass: skip PDF/DOCX/DOC when a .md counterpart already exists
  const filtered = allEntries.filter(entry => {
    const lower = entry.name.toLowerCase();
    const isHeavy = lower.endsWith('.pdf') || lower.endsWith('.docx') || lower.endsWith('.doc');
    if (isHeavy) {
      const base = lower.replace(/\.(pdf|docx|doc)$/, '');
      if (mdBasenames.has(base)) return false; // md version exists — skip original
    }
    return isSupportedFile(entry.name);
  });
  const mdCount = filtered.filter(e => e.name.toLowerCase().endsWith('.md')).length;
  const rawCount = filtered.filter(e => !e.name.toLowerCase().endsWith('.md')).length;
  if (mdCount > 0) onProgress && onProgress(`Reading ${mdCount} pre-converted .md file${mdCount!==1?'s':''} (markitdown)…`);
  const docs = [];
  for (const entry of filtered) {
    try {
      const file = await entry.getFile();
      onProgress && onProgress(`Reading ${entry.name}…`);
      const text = await extractFileText(file);
      docs.push({ name: entry.name, text, size: file.size });
    } catch(e) { console.warn(`Skip ${entry.name}:`, e.message); }
  }
  return docs;
};

// Request permission for a stored handle (needed after page reload)
const verifyPermission = async (handle) => {
  const opts = { mode: 'read' };
  if ((await handle.queryPermission(opts)) === 'granted') return true;
  if ((await handle.requestPermission(opts)) === 'granted') return true;
  return false;
};

                        {d.ride && (d.confidence==="low"||d.confidence==="manual") && <span style={{fontSize:10,background:"#e8f4f8",color:teal,borderRadius:10,padding:"1px 7px",fontWeight:500}}>{d.ride}</span>}
                        {!d.ride && <span style={{fontSize:10,color:"#e67e22",fontWeight:500}}>⚠ Needs ride tag</span>}
                        {d.confidence==="medium" && d.ride && <span style={{fontSize:10,color:"#b7770d"}}>— check this</span>}
                      </div>
                    </div>
                    <button onClick={()=>removeDoc(d.id)} style={{background:"none",border:"none",cursor:"pointer",color:"#c0392b",fontSize:18,padding:0,flexShrink:0}}>×</button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      {/* ── GENERATE TAB ── */}
      {tab==="generate" && (
        <div className="section-card">
          <p style={{fontSize:14,fontWeight:500,margin:"0 0 1rem",color:"#1a1a1a"}}>AI-generate standard-referenced hazards</p>
          {(rideFolders.length>0||uploadedDocs.length>0) && (()=>{
            const matchFolders=rideFolders.filter(f=>!f.ride||!deviceName||f.ride.trim().toLowerCase()===deviceName.trim().toLowerCase());
            const matchLegacy=uploadedDocs.filter(d=>!d.ride||!deviceName||d.ride.trim().toLowerCase()===deviceName.trim().toLowerCase());
            const totalFiles=matchFolders.reduce((s,f)=>s+f.fileCount,0)+matchLegacy.length;
            return(<p style={{fontSize:12,color:"#1e8449",margin:"0 0 1rem",padding:"6px 10px",background:"#eafaf1",borderRadius:6}}>
              <i className="ti ti-check" style={{marginRight:4}}/>
              {matchFolders.length>0?`${matchFolders.length} folder${matchFolders.length!==1?'s':''} (≈${totalFiles} files) matched to `:`${matchLegacy.length} file${matchLegacy.length!==1?'s':''} matched to `}
              <strong>{deviceName||"this device"}</strong> — read at generation time
            </p>);
          })()}
          <div style={{marginBottom:"0.75rem"}}>
            <label style={{fontSize:12,color:"#666",display:"block",marginBottom:8}}>Hazard source library — select device type</label>
            {SOURCE_LIBRARY.map(group=>(
              <div key={group.group} style={{marginBottom:10}}>
                <div style={{fontSize:11,fontWeight:600,color:"#888",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4,paddingLeft:2}}>{group.group}</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5}}>
                  {group.items.map(opt=>{
                    const sel = sourceSet===opt.id;
                    return (
                      <button key={opt.id} onClick={()=>setSourceSet(opt.id)}
                        title={opt.sub}
                        style={{padding:"7px 10px",fontSize:12,borderRadius:8,cursor:"pointer",textAlign:"left",
                          background:sel?teal:"#f7f7f7",color:sel?"#fff":"#333",
                          border:sel?`1px solid ${teal}`:"1px solid #e0e0e0",
                          transition:"all 0.15s"}}>
                        <div style={{fontWeight:sel?600:500,marginBottom:1}}>{opt.label}</div>
                        <div style={{fontSize:10,opacity:sel?0.85:0.6,lineHeight:1.3,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{opt.sub}</div>
                      </button>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
          <div style={{marginBottom:"0.75rem"}}>
            <label style={{fontSize:12,color:"#666",display:"block",marginBottom:4}}>Specific focus (optional)</label>
            <input value={topic} onChange={e=>setTopic(e.target.value)} style={iS} placeholder="e.g. tower swinger gondola restraints, wire rope inspection"/>
          </div>
          <div style={{marginBottom:"1rem"}}>
            <label style={{fontSize:12,color:"#666",display:"block",marginBottom:4}}>Additional context (optional)</label>
            <textarea value={extras} onChange={e=>setExtras(e.target.value)} rows={2} style={{...iS,resize:"vertical"}} placeholder="e.g. SBF tower swinger 42m, hydraulic lift, 36 riders per cycle"/>
          </div>
          <button onClick={()=>generate(false)} disabled={genLoading} style={{width:"100%",padding:"10px 0",borderRadius:8,background:genLoading?"#eee":teal,color:genLoading?"#999":"#fff",border:"none",cursor:genLoading?"not-allowed":"pointer",fontSize:14,fontWeight:500,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
            {genLoading?<><i className="ti ti-loader-2" style={{fontSize:16,animation:"spin 1s linear infinite"}}/>{genProgress||"Generating…"}</>:<><i className="ti ti-wand" style={{fontSize:16}}/>Generate — append to register</>}
          </button>
          <button onClick={clearAndRegenerate} disabled={genLoading} style={{width:"100%",marginTop:6,padding:"9px 0",borderRadius:8,background:genLoading?"#eee":"#fff",color:genLoading?"#999":"#b03030",border:"1px solid #e0b0b0",cursor:genLoading?"not-allowed":"pointer",fontSize:13,fontWeight:500,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
            <i className="ti ti-refresh-alert" style={{fontSize:15}}/>Replace all — clear &amp; regenerate from scratch
          </button>
          <p style={{fontSize:11,color:"#888",margin:"8px 0 0",textAlign:"center"}}>Append adds to existing register. Replace clears all wrong-device entries and regenerates fresh. Controls include accountability, frequency, parameters, evidence, and escalation.</p>
        </div>
      )}

      {/* ── BOUNDARY REPORT TAB ── */}
      {tab==="boundary" && (
        <div>
          <div className="section-card">
            <p style={{fontSize:14,fontWeight:500,margin:"0 0 4px",color:"#1a1a1a"}}>Device Boundary & Summary Report</p>
            <p style={{fontSize:12,color:"#666",margin:"0 0 1rem"}}>Generates a regulator-defensible device boundary report per ISO 17842-1, WHS Reg 2011 (Qld) Ch.9A, and the Qld Safety Case Guide. Uses uploaded documents as source material.</p>
            {rideFolders.length===0&&uploadedDocs.length===0 && <p style={{fontSize:12,color:"#e67e22",margin:"0 0 1rem",padding:"6px 10px",background:"#fef9e7",borderRadius:6}}><i className="ti ti-alert-triangle" style={{marginRight:4}}/>No documents — add ride folders or upload files on the Documents tab for a richer report.</p>}
            {(rideFolders.length>0||uploadedDocs.length>0) && (()=>{
              const tgt=(boundaryDevName||deviceName||"").trim().toLowerCase();
              const matchFolders=rideFolders.filter(f=>!f.ride||!tgt||f.ride.trim().toLowerCase()===tgt);
              const matchLegacy=uploadedDocs.filter(d=>!d.ride||!tgt||d.ride.trim().toLowerCase()===tgt);
              const totalFiles=matchFolders.reduce((s,f)=>s+f.fileCount,0)+matchLegacy.length;
              return(<p style={{fontSize:12,color:"#1e8449",margin:"0 0 1rem",padding:"6px 10px",background:"#eafaf1",borderRadius:6}}>
                <i className="ti ti-check" style={{marginRight:4}}/>
                {matchFolders.length>0?`${matchFolders.length} folder${matchFolders.length!==1?'s':''} (≈${totalFiles} files) matched to `:`${matchLegacy.length} file${matchLegacy.length!==1?'s':''} matched to `}
                <strong>{boundaryDevName||deviceName||"this device"}</strong> — read at generation time
              </p>);
            })()}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px 16px",marginBottom:"0.75rem"}}>
              <div>
                <label style={{fontSize:12,color:"#666",display:"block",marginBottom:4}}>Device name</label>
                <input value={boundaryDevName||deviceName} onChange={e=>setBoundaryDevName(e.target.value)} placeholder="e.g. Trident" style={iS}/>
              </div>
              <div>
                <label style={{fontSize:12,color:"#666",display:"block",marginBottom:4}}>Additional context (optional)</label>
                <input value={boundaryExtras} onChange={e=>setBoundaryExtras(e.target.value)} placeholder="e.g. SBF 42m tower swinger, Sea World" style={iS}/>
              </div>
            </div>
            <button onClick={runBoundaryReport} disabled={boundaryLoading} style={{width:"100%",padding:"10px 0",borderRadius:8,background:boundaryLoading?"#eee":teal,color:boundaryLoading?"#999":"#fff",border:"none",cursor:boundaryLoading?"not-allowed":"pointer",fontSize:14,fontWeight:500,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              {boundaryLoading?<><i className="ti ti-loader-2" style={{fontSize:16,animation:"spin 1s linear infinite"}}/>Generating report…</>:<><i className="ti ti-map-2" style={{fontSize:16}}/>Generate Boundary Report</>}
            </button>
            {boundaryError && <p style={{fontSize:12,color:"#c0392b",margin:"8px 0 0"}}>{boundaryError}</p>}
          </div>
          {boundaryReport && <BoundaryReportView report={boundaryReport} onExport={exportBoundaryDocx}/>}
        </div>
      )}

      {/* ── LIBRARY TAB ── */}
      {tab==="library" && (
        <div>
          <div className="section-card">
            <p style={{fontSize:14,fontWeight:500,margin:"0 0 4px",color:"#1a1a1a"}}>Cross-Device Hazard Library</p>
            <p style={{fontSize:12,color:"#666",margin:"0 0 1rem"}}>Your current register ({entries.length} entries) forms the library. Enter a different device type to get AI suggestions on which library hazards may apply.</p>
            <div style={{display:"flex",gap:8}}>
              <input value={libDevice} onChange={e=>setLibDevice(e.target.value)} placeholder="New device type — e.g. Sea Viper roller coaster, Carousel" style={{...iS,flex:1}}/>
              <button onClick={runLibrarySuggestions} disabled={libLoading||!libDevice.trim()||entries.length===0||!apiKey} style={{padding:"7px 14px",background:teal,color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:6}}>
                {libLoading?<><i className="ti ti-loader-2" style={{fontSize:13,animation:"spin 1s linear infinite"}}/>Analysing…</>:<><i className="ti ti-search" style={{fontSize:13}}/>Suggest applicable</>}
              </button>
            </div>
            {libSuggestions && !libSuggestions.error && Array.isArray(libSuggestions) && (
              <div style={{marginTop:"1rem"}}>
                <p style={{fontSize:12,fontWeight:500,color:"#666",margin:"0 0 8px"}}>{libSuggestions.length} library hazard{libSuggestions.length!==1?'s':''} suggested as applicable to "{libDevice}"</p>
                {libSuggestions.map((s,i)=>{
                  const entry=entries.find(e=>e.id===s.id);
                  return (
                    <div key={i} style={{padding:"8px 12px",background:"#f0f9f9",borderRadius:8,marginBottom:6,border:"1px solid #c8e6e8"}}>
                      <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:4}}>
                        <span style={{fontSize:11,fontWeight:600,color:teal}}>{s.id}</span>
                        <span style={{fontSize:12,flex:1}}>{entry?.hazard||s.id}</span>
                      </div>
                      <p style={{fontSize:12,color:"#555",margin:0}}><strong>Why applicable:</strong> {s.reason}</p>
                    </div>
                  );
                })}
              </div>
            )}
            {libSuggestions?.error && <p style={{fontSize:12,color:"#c0392b",margin:"8px 0 0"}}>Error: {libSuggestions.error}</p>}
          </div>
          {entries.length>0 && (
            <div className="section-card">
              <p style={{fontSize:13,fontWeight:500,color:"#666",margin:"0 0 8px"}}>Library entries ({entries.length} total)</p>
              {entries.map(e=>{
                const r=RATING(e.likelihood,e.consequence);
                const libHighlight=libSuggestions&&Array.isArray(libSuggestions)&&libSuggestions.some(s=>s.id===e.id);
                return (
                  <div key={e.id} style={{padding:"6px 10px",borderRadius:6,marginBottom:4,background:libHighlight?"#f0f9f9":"#fafafa",border:libHighlight?"1px solid #c8e6e8":"1px solid #eee",display:"flex",gap:8,alignItems:"center"}}>
                    <span style={{fontSize:11,fontWeight:600,color:teal,minWidth:44}}>{e.id}</span>
                    <span style={{fontSize:12,flex:1,color:"#333"}}>{e.hazard}</span>
                    <span style={{fontSize:10,padding:"1px 6px",borderRadius:8,background:r.color+"22",color:r.color,whiteSpace:"nowrap"}}>{r.label}</span>
                    {libHighlight && <span style={{fontSize:10,padding:"1px 6px",borderRadius:8,background:"#004348",color:"#fff"}}>Suggested</span>}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* ── ADD MANUAL TAB ── */}
      {tab==="add" && (
        <div className="section-card">
          {!editMode
            ? <div style={{textAlign:"center",padding:"1rem 0"}}>
                <p style={{fontSize:14,margin:"0 0 1rem",color:"#666"}}>Manually add a hazard to the register</p>
                <button onClick={addEntry} style={{padding:"8px 20px",background:teal,color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13}}>Add new entry</button>
              </div>
            : <ManualForm entry={editEntry} onChange={setEditEntry} onSave={()=>{saveNew();setTab("register");}} onCancel={()=>{setEditMode(false);setEditEntry(null);}} isNew={true} iS={iS} blankControl={blankControl}/>
          }
        </div>
      )}

      {/* ── REGISTER TAB ── */}
      {tab==="register" && (
        <div>
          {entries.length>0 && (
            <div style={{display:"flex",gap:8,marginBottom:"1rem",flexWrap:"wrap"}}>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search hazards, risks, controls…" style={{...iS,flex:2,minWidth:180}}/>
              {allParks.length>0 && (
                <select value={filterPark} onChange={e=>setFilterPark(e.target.value)} style={{...iS,flex:1,minWidth:120}}>
                  <option value="All">All parks</option>
                  {allParks.map(p=><option key={p}>{p}</option>)}
                </select>
              )}
              {allDevices.length>0 && (
                <select value={filterDevice} onChange={e=>setFilterDevice(e.target.value)} style={{...iS,flex:1,minWidth:130}}>
                  <option value="All">All devices</option>
                  <option value="Common">⭐ Common only</option>
                  {allDevices.map(d=><option key={d}>{d}</option>)}
                </select>
              )}
              <select value={filterCat} onChange={e=>setFilterCat(e.target.value)} style={{...iS,flex:1,minWidth:130}}>
                <option value="All">All categories</option>
                {allCats.map(c=><option key={c}>{c}</option>)}
              </select>
              <select value={filterFlag} onChange={e=>setFilterFlag(e.target.value)} style={{...iS,flex:1,minWidth:120}}>
                <option value="All">All flags</option>
                <option value="ADI">ADI only</option>
                <option value="ADH">ADH only</option>
                <option value="Extreme/High">Extreme / High</option>
              </select>
              {(search||filterCat!=="All"||filterFlag!=="All"||filterDevice!=="All"||filterPark!=="All") && <button onClick={()=>{setSearch("");setFilterCat("All");setFilterFlag("All");setFilterDevice("All");setFilterPark("All");}} style={{padding:"7px 12px",fontSize:12,border:"1px solid #ddd",borderRadius:7,background:"transparent",cursor:"pointer",color:"#888"}}>Clear</button>}
            </div>
          )}
          {editMode && editEntry && entries.some(e=>e.id===editEntry.id) && (
            <div className="section-card" style={{marginBottom:"1rem"}}>
              <p style={{fontSize:14,fontWeight:500,margin:"0 0 1rem"}}>Edit — {editEntry.id}</p>
              <ManualForm entry={editEntry} onChange={setEditEntry} onSave={saveEdit} onCancel={()=>{setEditMode(false);setEditEntry(null);}} isNew={false} iS={iS} blankControl={blankControl}/>
            </div>
          )}
          {entries.length===0
            ? <div style={{textAlign:"center",padding:"3rem 1rem",color:"#888",background:"#fff",borderRadius:12,border:"1px solid #eee"}}>
                <p style={{fontSize:14,margin:"0 0 8px"}}>No entries yet</p>
                <p style={{fontSize:12,margin:"0 0 1.5rem"}}>Upload device documents, then use AI Generate — or add entries manually</p>
                <button onClick={()=>setTab("documents")} style={{padding:"8px 16px",background:teal,color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,marginRight:8}}>Upload Documents</button>
                <button onClick={()=>setTab("generate")} style={{padding:"8px 16px",background:"transparent",color:teal,border:`1px solid ${teal}`,borderRadius:8,cursor:"pointer",fontSize:13,marginRight:8}}>AI Generate</button>
                <button onClick={()=>{addEntry();setTab("add");}} style={{padding:"8px 16px",background:"transparent",color:"#666",border:"1px solid #ddd",borderRadius:8,cursor:"pointer",fontSize:13}}>Add Manually</button>
              </div>
            : filtered.length===0
            ? <div style={{textAlign:"center",padding:"2rem 1rem",color:"#888",background:"#fff",borderRadius:12,border:"1px solid #eee"}}>
                <p style={{fontSize:13,margin:0}}>No entries match filters</p>
              </div>
            : cats.map(cat=>(
                <div key={cat} style={{marginBottom:"1.25rem"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                    <span style={{fontSize:11,fontWeight:500,background:`${teal}15`,color:teal,padding:"2px 10px",borderRadius:20}}>{cat}</span>
                    <span style={{fontSize:11,color:"#888"}}>{filtered.filter(e=>e.category===cat).length} entries</span>
                  </div>
                  {filtered.filter(e=>e.category===cat).map(e=>(
                    <HazardCard key={e.id} entry={e} selected={selected===e.id}
                      onSelect={()=>setSelected(selected===e.id?null:e.id)}
                      onEdit={()=>{setEditEntry(normalizeEntry({...e}));setEditMode(true);}}
                      onDelete={()=>deleteEntry(e.id)}
                      onToggleCommon={()=>setEntries(prev=>{const u=prev.map(x=>x.id===e.id?{...x,isCommon:!x.isCommon}:x);saveToStorage(u);return u;})}/>
                  ))}
                </div>
              ))
          }
        </div>
      )}
    </div>
  );
}

// ─── DOCUMENT DROP ZONE ───────────────────────────────────────────────────────
function DocumentDropZone({onFiles, loading}) {
  const [dragOver, setDragOver] = useState(false);
  return (
    <div
      className={`drop-zone${dragOver?' over':''}`}
      onDragOver={e=>{e.preventDefault();setDragOver(true);}}
      onDragLeave={()=>setDragOver(false)}
      onDrop={e=>{e.preventDefault();setDragOver(false);if(!loading)onFiles(e.dataTransfer.files);}}
    >
      <input type="file" accept=".pdf,.docx,.doc,.txt" multiple onChange={e=>{if(!loading)onFiles(e.target.files);e.target.value='';}} id="fileInput" style={{display:'none'}}/>
      <label htmlFor="fileInput" style={{cursor:'pointer',display:'block'}}>
        {loading
          ? <><i className="ti ti-loader-2" style={{fontSize:24,display:'block',margin:'0 auto 8px',animation:'spin 1s linear infinite',color:teal}}/><p style={{fontSize:13,color:'#666',margin:0}}>Extracting text…</p></>
          : <><i className="ti ti-cloud-upload" style={{fontSize:32,display:'block',margin:'0 auto 8px',color:dragOver?teal:'#bbb'}}/><p style={{fontSize:13,color:'#666',margin:0}}>Drop PDF, DOCX, or TXT files here<br/><span style={{fontSize:12,color:'#aaa'}}>or click to browse</span></p></>
        }
      </label>
    </div>
  );
}

// ─── HAZARD CARD ──────────────────────────────────────────────────────────────
function HazardCard({entry:e, selected, onSelect, onEdit, onDelete, onToggleCommon}) {
  const s=e.consequence*e.likelihood;
  const r=RATING(e.likelihood,e.consequence);
  const controls=(e.controls||[]).map(normalizeControl);
  const criticals=controls.filter(c=>c.isCritical);
  return (
    <div style={{background:"#fff",border:`1px solid ${e.isCommon?"#6c3483":selected?teal:"#e8e8e8"}`,borderRadius:10,marginBottom:6,overflow:"hidden"}}>
      <div onClick={onSelect} style={{display:"flex",alignItems:"center",gap:8,padding:"10px 14px",cursor:"pointer",flexWrap:"wrap"}}>
        <span style={{fontSize:11,fontWeight:600,color:teal,minWidth:44}}>{e.id}</span>
        <span style={{flex:1,minWidth:120}}>
          {e.riskTitle && <span style={{fontSize:11,fontWeight:600,color:teal,display:"block",marginBottom:1}}>{e.riskTitle}</span>}
          <span style={{fontSize:13,color:"#1a1a1a"}}>{e.hazard}</span>
        </span>
        {e.device && <span style={{fontSize:10,fontWeight:500,padding:"2px 7px",borderRadius:10,whiteSpace:"nowrap",background:"#f0f0f0",color:"#555"}}><i className="ti ti-device-gamepad-2" style={{fontSize:9,marginRight:3}}/>{e.device}</span>}
        {e.isCommon && <span style={{fontSize:10,fontWeight:600,padding:"2px 7px",borderRadius:10,whiteSpace:"nowrap",background:"#f5eef8",color:"#6c3483"}}>⭐ Common</span>}
        {e.hazardType && <span style={{fontSize:10,fontWeight:500,padding:"2px 7px",borderRadius:10,whiteSpace:"nowrap",background:e.hazardType==="Amusement Device"?"#E8F4F8":e.hazardType==="Both"?"#EAF0FB":"#F4F4F4",color:e.hazardType==="Amusement Device"?teal:e.hazardType==="Both"?"#1a3a6b":"#555"}}>{e.hazardType}</span>}
        {e.adiTrigger && <span style={{fontSize:10,fontWeight:500,background:"#FADBD8",color:"#922B21",padding:"2px 7px",borderRadius:10,whiteSpace:"nowrap"}}>ADI</span>}
        {e.adhTrigger && <span style={{fontSize:10,fontWeight:500,background:"#F5EEF8",color:"#7D3C98",padding:"2px 7px",borderRadius:10,whiteSpace:"nowrap"}}>ADH</span>}
        {criticals.length>0 && <span style={{fontSize:10,fontWeight:500,background:"#FEF9E7",color:"#B7770D",padding:"2px 7px",borderRadius:10,whiteSpace:"nowrap"}}>★ {criticals.length} Critical</span>}
        <span style={{fontSize:11,fontWeight:500,padding:"2px 8px",borderRadius:10,whiteSpace:"nowrap",background:r.color+"22",color:r.color}}>{s} — {r.label}</span>
        <i className={`ti ti-chevron-${selected?"up":"down"}`} style={{fontSize:14,color:"#888"}}/>
      </div>
      {selected && (
        <div style={{borderTop:"1px solid #eee",padding:"12px 14px",fontSize:13}}>
          {/* Risk description + causes */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px 16px",marginBottom:8}}>
            <Field label="Risk description" val={e.risk}/>
            <Field label="Causes" val={e.causes}/>
          </div>
          {/* Inherent rating justifications */}
          {(e.inherentConsequenceJustification||e.inherentLikelihoodJustification) && (
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px 16px",marginBottom:8,padding:"8px 10px",background:"#f9f9f9",borderRadius:7,border:"1px solid #eee"}}>
              <Field label="Inherent consequence justification" val={e.inherentConsequenceJustification}/>
              <Field label="Inherent likelihood justification" val={e.inherentLikelihoodJustification}/>
            </div>
          )}
          {/* SFARP — Extreme/High only */}
          {e.sfarpJustification && (
            <div style={{marginBottom:8,padding:"8px 10px",background:"#fff8f0",borderRadius:7,border:"1px solid #f5cba7"}}>
              <Field label="SFARP justification (Extreme/High)" val={e.sfarpJustification}/>
            </div>
          )}
          {/* Controls list */}
          <div style={{marginBottom:8}}>
            <p style={{fontSize:11,color:"#888",margin:"0 0 6px"}}>Controls ({controls.length})</p>
            {controls.map((c,i)=>{
              const effColor=c.effectiveness<=2?"#1e8449":c.effectiveness===3?"#b7770d":c.effectiveness>=4?"#c0392b":"#888";
              return (
                <div key={i} style={{display:"flex",gap:6,marginBottom:4,alignItems:"flex-start"}}>
                  <span style={{fontSize:11,color:"#888",minWidth:18}}>{i+1}.</span>
                  <span style={{fontSize:12,flex:1,color:"#1a1a1a",lineHeight:1.4}}>{c.description}</span>
                  {c.isCritical && <span style={{fontSize:10,background:"#FEF9E7",color:"#B7770D",padding:"1px 6px",borderRadius:8,whiteSpace:"nowrap",fontWeight:500}}>★ Critical</span>}
                  <span style={{fontSize:10,background:c.controlType==="Prevention"?"#e8f4f8":"#fef0f8",color:c.controlType==="Prevention"?teal:"#7d3c98",padding:"1px 6px",borderRadius:8,whiteSpace:"nowrap"}}>{c.controlType||"Prevention"}</span>
                  <span style={{fontSize:10,background:"#f0f0f0",color:"#666",padding:"1px 6px",borderRadius:8,whiteSpace:"nowrap"}}>{c.hierarchy}</span>
                  {c.effectiveness && <span style={{fontSize:10,color:effColor,fontWeight:500,whiteSpace:"nowrap"}}>E{c.effectiveness}</span>}
                </div>
              );
            })}
          </div>
          {/* Critical controls bowtie table */}
          {criticals.length>0 && (
            <div style={{marginBottom:10}}>
              <p style={{fontSize:11,color:"#888",margin:"0 0 6px",fontWeight:500}}>Critical Controls — verification detail</p>
              <div style={{overflowX:"auto"}}>
                <table className="ctrl-table">
                  <thead><tr>
                    <th style={{minWidth:180}}>Control</th>
                    <th style={{minWidth:80}}>Type</th>
                    <th style={{minWidth:60}}>Eff.</th>
                    <th style={{minWidth:120}}>Accountability</th>
                    <th style={{minWidth:100}}>Frequency</th>
                    <th style={{minWidth:150}}>Parameters (perf. criteria)</th>
                    <th style={{minWidth:150}}>Evidence / verification</th>
                    <th style={{minWidth:200}}>Escalation on failure</th>
                    <th style={{minWidth:100}}>Standard</th>
                  </tr></thead>
                  <tbody>
                    {criticals.map((c,i)=>{
                      const effColor=c.effectiveness<=2?"#1e8449":c.effectiveness===3?"#b7770d":"#c0392b";
                      return (
                        <tr key={i}>
                          <td style={{fontWeight:500}}>{c.description}</td>
                          <td><span style={{fontSize:10,background:c.controlType==="Prevention"?"#e8f4f8":"#fef0f8",color:c.controlType==="Prevention"?teal:"#7d3c98",padding:"1px 5px",borderRadius:6}}>{c.controlType||"Prevention"}</span></td>
                          <td style={{color:effColor,fontWeight:600,textAlign:"center"}}>{c.effectiveness||"—"}</td>
                          <td>{c.accountability||"—"}</td>
                          <td>{c.frequency||"—"}</td>
                          <td>{c.parameters||"—"}</td>
                          <td>{c.evidence||"—"}</td>
                          <td style={{color:"#c0392b"}}>{c.escalation||"—"}</td>
                          <td style={{color:"#666",fontSize:11}}>{c.standard||"—"}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}
          {/* Risk reduction justification */}
          {e.riskReductionJustification && (
            <div style={{marginBottom:8,padding:"8px 10px",background:"#eafaf1",borderRadius:7,border:"1px solid #a9dfbf"}}>
              <Field label="Risk reduction justification (SFARP)" val={e.riskReductionJustification}/>
            </div>
          )}
          {(e.standards||[]).filter(Boolean).length>0 && (
            <div style={{marginTop:8}}>
              <p style={{fontSize:11,color:"#888",margin:"0 0 4px"}}>Standards referenced</p>
              <div style={{display:"flex",flexWrap:"wrap",gap:4}}>{e.standards.filter(Boolean).map((s,i)=><span key={i} style={{fontSize:11,background:"#f5f5f5",padding:"2px 8px",borderRadius:6,color:"#666"}}>{s}</span>)}</div>
            </div>
          )}
          <div style={{display:"flex",gap:8,marginTop:10,justifyContent:"flex-end",flexWrap:"wrap"}}>
            <button onClick={onToggleCommon} style={{display:"flex",alignItems:"center",gap:4,padding:"5px 10px",fontSize:12,border:`1px solid ${e.isCommon?"#6c3483":"#ddd"}`,borderRadius:6,background:e.isCommon?"#f5eef8":"transparent",cursor:"pointer",color:e.isCommon?"#6c3483":"#555"}}>
              {e.isCommon?"⭐ Common (click to remove)":"☆ Mark as Common"}
            </button>
            <button onClick={onEdit} style={{display:"flex",alignItems:"center",gap:4,padding:"5px 10px",fontSize:12,border:"1px solid #ddd",borderRadius:6,background:"transparent",cursor:"pointer"}}><i className="ti ti-edit" style={{fontSize:13}}/>Edit</button>
            <button onClick={onDelete} style={{display:"flex",alignItems:"center",gap:4,padding:"5px 10px",fontSize:12,border:"1px solid #e8a09a",borderRadius:6,background:"transparent",cursor:"pointer",color:"#c0392b"}}><i className="ti ti-trash" style={{fontSize:13}}/>Delete</button>
          </div>
        </div>
      )}
    </div>
  );
}

function Field({label,val}) {
  return (
    <div>
      <p style={{fontSize:11,color:"#888",margin:"0 0 2px"}}>{label}</p>
      <p style={{fontSize:13,margin:0,color:"#1a1a1a",whiteSpace:"pre-line",lineHeight:1.5}}>{val||"—"}</p>
    </div>
  );
}

// ─── MANUAL FORM ──────────────────────────────────────────────────────────────
function ManualForm({entry, onChange, onSave, onCancel, isNew, iS, blankControl}) {
  const [expandedCtrl, setExpandedCtrl] = useState(null);
  const upd=(k,v)=>onChange(p=>({...p,[k]:v}));
  const controls=(entry.controls||[]).map(c=>typeof c==='string'?normalizeControl(c):c);
  const updCtrl=(i,field,v)=>onChange(p=>({...p,controls:controls.map((c,j)=>j===i?{...c,[field]:v}:c)}));
  const addCtrl=()=>{onChange(p=>({...p,controls:[...controls,blankControl()]}));setExpandedCtrl(controls.length);};
  const remCtrl=(i)=>{onChange(p=>({...p,controls:controls.filter((_,j)=>j!==i)}));setExpandedCtrl(null);};
  const lbl=(t)=><label style={{fontSize:12,color:"#666",display:"block",marginBottom:3}}>{t}</label>;
  const smallInput=(field,ctrl,i,ph)=>(
    <div style={{marginBottom:6}}>
      {lbl(field.charAt(0).toUpperCase()+field.slice(1))}
      <input value={ctrl[field]||''} onChange={e=>updCtrl(i,field,e.target.value)} style={iS} placeholder={ph||''}/>
    </div>
  );
  return (
    <div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px 16px",marginBottom:10}}>
        <div>{lbl("Category")}<select value={entry.category} onChange={e=>upd("category",e.target.value)} style={iS}>{CATEGORIES.map(c=><option key={c}>{c}</option>)}</select></div>
        <div>{lbl("Hazard type")}<select value={entry.hazardType||"General Workplace"} onChange={e=>upd("hazardType",e.target.value)} style={iS}><option>General Workplace</option><option>Amusement Device</option><option>Both</option></select></div>
      </div>
      <div style={{marginBottom:6}}><input type="checkbox" id="adi" checked={entry.adiTrigger} onChange={e=>upd("adiTrigger",e.target.checked)} style={{marginRight:8,verticalAlign:-2}}/><label htmlFor="adi" style={{fontSize:13}}>ADI trigger — s 608B(2) WHS Reg 2011 (Qld)</label></div>
      <div style={{marginBottom:10}}><input type="checkbox" id="adh" checked={!!entry.adhTrigger} onChange={e=>upd("adhTrigger",e.target.checked)} style={{marginRight:8,verticalAlign:-2}}/><label htmlFor="adh" style={{fontSize:13}}>ADH trigger — could cause or contribute to an ADI</label></div>
      <div style={{marginBottom:8}}>{lbl("Risk title (5–8 words)")}<input value={entry.riskTitle||''} onChange={e=>upd("riskTitle",e.target.value)} style={iS} placeholder="e.g. Wire Rope Failure During Gondola Ascent"/></div>
      <div style={{marginBottom:8}}>{lbl('Hazard — "The presence of [source] in [area] may expose [person] to harm during [circumstance]"')}<textarea value={entry.hazard||''} onChange={e=>upd("hazard",e.target.value)} rows={2} style={{...iS,resize:"vertical"}} placeholder="The presence of [hazard source] in [specific area/task/process] may expose [person/group] to harm during [occurrence or circumstance]."/></div>
      <div style={{marginBottom:8}}>{lbl('Risk — "There is a risk that [occurrence] may occur... The risk may be caused by..."')}<textarea value={entry.risk||''} onChange={e=>upd("risk",e.target.value)} rows={3} style={{...iS,resize:"vertical"}} placeholder="There is a risk that [occurrence] may occur, which could result in [primary consequence] and [secondary consequences], due to [context]. The risk may be caused by [immediate causes], due to [underlying causes]."/></div>
      <div style={{marginBottom:8}}>{lbl('Causes — "The risk may be caused by [immediate causes], due to [underlying/systemic causes]"')}<textarea value={entry.causes||''} onChange={e=>upd("causes",e.target.value)} rows={2} style={{...iS,resize:"vertical"}} placeholder="The risk may be caused by [immediate/technical causes], due to [underlying/systemic causes]. [Standard clause]"/></div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px 12px",marginBottom:8}}>
        <div>{lbl('Inherent consequence justification')}<textarea value={entry.inherentConsequenceJustification||''} onChange={e=>upd("inherentConsequenceJustification",e.target.value)} rows={2} style={{...iS,resize:"vertical"}} placeholder="A [rating] consequence is justified because [evidence/reasoning], consistent with the [matrix category] definition."/></div>
        <div>{lbl('Inherent likelihood justification')}<textarea value={entry.inherentLikelihoodJustification||''} onChange={e=>upd("inherentLikelihoodJustification",e.target.value)} rows={2} style={{...iS,resize:"vertical"}} placeholder="The likelihood is rated as [rating] because [frequency/exposure/history], consistent with the matrix definition."/></div>
      </div>
      {/* Controls */}
      <div style={{marginBottom:10}}>
        {lbl("Controls")}
        {controls.map((c,i)=>(
          <div key={i} style={{border:"1px solid #e8e8e8",borderRadius:8,marginBottom:6,overflow:"hidden"}}>
            <div style={{display:"flex",alignItems:"center",gap:6,padding:"8px 10px",background:"#fafafa",cursor:"pointer"}} onClick={()=>setExpandedCtrl(expandedCtrl===i?null:i)}>
              <span style={{fontSize:11,color:"#888",minWidth:18}}>{i+1}.</span>
              <span style={{fontSize:12,flex:1,color:c.description?"#1a1a1a":"#aaa"}}>{c.description||"(no description)"}</span>
              {c.isCritical && <span style={{fontSize:10,background:"#FEF9E7",color:"#B7770D",padding:"1px 6px",borderRadius:8,fontWeight:500}}>★ Critical</span>}
              <span style={{fontSize:10,background:c.controlType==="Mitigation"?"#fef0f8":"#e8f4f8",color:c.controlType==="Mitigation"?"#7d3c98":teal,padding:"1px 5px",borderRadius:6}}>{c.controlType||"Prevention"}</span>
              <span style={{fontSize:10,background:"#f0f0f0",color:"#666",padding:"1px 5px",borderRadius:6}}>{c.hierarchy}</span>
              <span style={{fontSize:10,color:c.effectiveness<=2?"#1e8449":c.effectiveness>=4?"#c0392b":"#b7770d",fontWeight:600}}>E{c.effectiveness||3}</span>
              <i className={`ti ti-chevron-${expandedCtrl===i?"up":"down"}`} style={{fontSize:12,color:"#888"}}/>
              {controls.length>1 && <button onClick={e=>{e.stopPropagation();remCtrl(i);}} style={{background:"none",border:"none",cursor:"pointer",color:"#c0392b",fontSize:16,padding:0}}>×</button>}
            </div>
            {expandedCtrl===i && (
              <div style={{padding:"10px 12px",borderTop:"1px solid #eee",display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px 12px"}}>
                <div style={{gridColumn:"1/-1"}}>{lbl("Description")}<input value={c.description||''} onChange={e=>updCtrl(i,'description',e.target.value)} style={iS} placeholder="Full control description"/></div>
                <div style={{display:"flex",alignItems:"center",gap:8,gridColumn:"1/-1",flexWrap:"wrap"}}>
                  <input type="checkbox" id={`crit${i}`} checked={c.isCritical} onChange={e=>updCtrl(i,'isCritical',e.target.checked)}/>
                  <label htmlFor={`crit${i}`} style={{fontSize:13}}>Critical Control (★)</label>
                  <select value={c.controlType||'Prevention'} onChange={e=>updCtrl(i,'controlType',e.target.value)} style={{...iS,width:"auto"}}>
                    <option>Prevention</option><option>Mitigation</option>
                  </select>
                  <select value={c.hierarchy||'Administrative'} onChange={e=>updCtrl(i,'hierarchy',e.target.value)} style={{...iS,width:"auto",flex:1}}>
                    {HIERARCHY_OPTS.map(h=><option key={h}>{h}</option>)}
                  </select>
                  <select value={c.effectiveness||3} onChange={e=>updCtrl(i,'effectiveness',Number(e.target.value))} style={{...iS,width:"auto"}}>
                    {CTRL_EFFECTIVENESS.map((ef,idx)=><option key={idx+1} value={idx+1}>{ef}</option>)}
                  </select>
                </div>
                {[['accountability','Accountability','Role responsible — e.g. Attractions Supervisor'],['frequency','Frequency','When applied — e.g. Before each dispatch / Daily'],['parameters','Parameters','Measurable criteria — e.g. Lap bar green, wind < 40 km/h'],['evidence','Evidence','How verified — e.g. Pre-start checklist, CMMS work order'],['escalation','Escalation on failure','Action if fails — e.g. Stop ride, notify Supervisor'],['standard','Standard reference','e.g. AS 3533.2 cl.4.3']].map(([field,label,ph])=>(
                  <div key={field}>{lbl(label)}<input value={c[field]||''} onChange={e=>updCtrl(i,field,e.target.value)} style={iS} placeholder={ph}/></div>
                ))}
              </div>
            )}
          </div>
        ))}
        <button onClick={addCtrl} style={{fontSize:12,border:"none",background:"transparent",cursor:"pointer",color:"#888",padding:"2px 0"}}>+ Add control</button>
      </div>
      {/* Standards */}
      <div style={{marginBottom:8}}>
        {lbl("Standards referenced")}
        {(entry.standards||[""]).map((s,i)=>(
          <div key={i} style={{display:"flex",gap:6,marginBottom:5}}>
            <input value={s} onChange={e=>{const a=[...(entry.standards||[""])];a[i]=e.target.value;upd("standards",a);}} style={{...iS,flex:1}} placeholder="e.g. AS 3533.1 — cl. 4.2.1"/>
            {(entry.standards||[""]).length>1 && <button onClick={()=>{const a=(entry.standards||[""]).filter((_,j)=>j!==i);upd("standards",a);}} style={{padding:"0 8px",border:"1px solid #e8a09a",borderRadius:6,background:"transparent",cursor:"pointer",color:"#c0392b",fontSize:16}}>×</button>}
          </div>
        ))}
        <button onClick={()=>upd("standards",[...(entry.standards||[""]),""]) } style={{fontSize:12,border:"none",background:"transparent",cursor:"pointer",color:"#888",padding:"2px 0"}}>+ Add standard</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px 16px",marginBottom:12}}>
        <div>{lbl(`Consequence — ${CONSEQUENCE[entry.consequence-1]}`)}<input type="range" min={1} max={5} step={1} value={entry.consequence} onChange={e=>upd("consequence",Number(e.target.value))} style={{width:"100%"}}/></div>
        <div>{lbl(`Likelihood — ${LIKELIHOOD[entry.likelihood-1]}`)}<input type="range" min={1} max={5} step={1} value={entry.likelihood} onChange={e=>upd("likelihood",Number(e.target.value))} style={{width:"100%"}}/></div>
      </div>
      <div style={{padding:"8px 12px",borderRadius:8,marginBottom:8,background:RATING(entry.likelihood,entry.consequence).color+"18",border:`1px solid ${RATING(entry.likelihood,entry.consequence).color}44`}}>
        <span style={{fontSize:13,fontWeight:500,color:RATING(entry.likelihood,entry.consequence).color}}>Risk score: {entry.consequence*entry.likelihood} — {RATING(entry.likelihood,entry.consequence).label}</span>
      </div>
      {["Extreme","High"].includes(RATING(entry.likelihood,entry.consequence).label) && (
        <div style={{marginBottom:8}}>
          {lbl("SFARP justification (required — Extreme/High risk)")}
          <textarea value={entry.sfarpJustification||''} onChange={e=>upd("sfarpJustification",e.target.value)} rows={3} style={{...iS,resize:"vertical",borderColor:"#e67e22"}} placeholder="The level of risk has been reduced so far as is reasonably practicable. All feasible controls have been considered in accordance with WHS Act s.18, having regard to the likelihood, degree of harm, state of knowledge, availability, suitability, and cost of additional controls."/>
        </div>
      )}
      <div style={{marginBottom:8}}>
        {lbl("Risk reduction justification")}
        <textarea value={entry.riskReductionJustification||''} onChange={e=>upd("riskReductionJustification",e.target.value)} rows={2} style={{...iS,resize:"vertical"}} placeholder="The implemented controls reduce the risk by [mechanism], resulting in [specific reduction in likelihood/consequence] consistent with SFARP principles."/>
      </div>
      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
        <button onClick={onCancel} style={{padding:"7px 14px",fontSize:13,border:"1px solid #ddd",borderRadius:8,background:"transparent",cursor:"pointer"}}>Cancel</button>
        <button onClick={onSave} disabled={!entry?.hazard?.trim()} style={{padding:"7px 14px",fontSize:13,background:entry?.hazard?.trim()?teal:"#eee",color:entry?.hazard?.trim()?"#fff":"#999",border:"none",borderRadius:8,cursor:entry?.hazard?.trim()?"pointer":"not-allowed",fontWeight:500}}>{isNew?"Add to register":"Save changes"}</button>
      </div>
    </div>
  );
}

// ─── BOUNDARY REPORT VIEW ─────────────────────────────────────────────────────
function BoundaryReportView({report:br, onExport}) {
  if (!br) return null;
  const Section=({title,children})=>(
    <div className="section-card br-section" style={{marginBottom:"0.75rem"}}>
      <h3>{title}</h3>
      {children}
    </div>
  );
  const ZoneTypeBadge=({type})=>{
    const colors={footprint:"#e8f4f8",envelope:"#fadbd8",safe_zone:"#eafaf1",maintenance:"#fef9e7",access:"#f0edfb",restricted:"#fadbd8"};
    const textColors={footprint:teal,envelope:"#c0392b",safe_zone:"#1e8449",maintenance:"#b7770d",access:"#6c3483",restricted:"#c0392b"};
    return <span className="zone-badge" style={{background:colors[type]||"#f0f0f0",color:textColors[type]||"#666"}}>{type}</span>;
  };
  return (
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"0.75rem"}}>
        <p style={{fontSize:14,fontWeight:500,color:teal,margin:0}}>{br.deviceName} — Boundary Report generated</p>
        <button onClick={onExport} style={{display:"flex",alignItems:"center",gap:6,padding:"7px 14px",fontSize:13,background:teal,color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontWeight:500}}><i className="ti ti-file-word" style={{fontSize:14}}/>Export Word</button>
      </div>
      <Section title="1. Device Identification">
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"4px 16px"}}>
          {[["Device",br.deviceName],["Manufacturer",br.manufacturer],["Type",br.deviceType],["Location",br.location],["Regulatory Class",br.regulatoryClass]].map(([k,v])=>(
            <p key={k} style={{fontSize:13,margin:0}}><strong style={{color:"#666"}}>{k}:</strong> {v||"—"}</p>
          ))}
        </div>
        {br.capacity && <p style={{fontSize:13,margin:"8px 0 0"}}><strong style={{color:"#666"}}>Capacity:</strong> {br.capacity.ridersPerCycle} riders · {br.capacity.cycleTimeSec}s cycle · {br.capacity.throughputPerHour} pax/hr</p>}
      </Section>
      <Section title="2. Safety Envelope Definition">
        <p>{br.safetyEnvelopeDefinition||"—"}</p>
      </Section>
      {(br.boundaryIncludes||[]).length>0 && (
        <Section title="3. Inside the Device Boundary">
          <div style={{overflowX:"auto"}}>
            <table className="ctrl-table">
              <thead><tr><th>Zone</th><th>Description</th><th>Basis</th></tr></thead>
              <tbody>{br.boundaryIncludes.map((z,i)=><tr key={i}><td style={{fontWeight:500}}>{z.zone}</td><td>{z.description}</td><td style={{color:"#666",fontSize:11}}>{z.basis}</td></tr>)}</tbody>
            </table>
          </div>
        </Section>
      )}
      {(br.boundaryExcludes||[]).length>0 && (
        <Section title="4. Outside the Device Boundary">
          <div style={{overflowX:"auto"}}>
            <table className="ctrl-table">
              <thead><tr><th>Item</th><th>Reason Excluded</th></tr></thead>
              <tbody>{br.boundaryExcludes.map((z,i)=><tr key={i}><td style={{fontWeight:500}}>{z.item}</td><td>{z.reason}</td></tr>)}</tbody>
            </table>
          </div>
        </Section>
      )}
      {(br.operationalZones||[]).length>0 && (
        <Section title="5. Operational Zones">
          <div style={{overflowX:"auto"}}>
            <table className="ctrl-table">
              <thead><tr><th>Zone</th><th>Type</th><th>Description</th><th>Access Conditions</th><th>Envelope?</th></tr></thead>
              <tbody>{br.operationalZones.map((z,i)=><tr key={i}><td style={{fontWeight:500}}>{z.name}</td><td><ZoneTypeBadge type={z.type}/></td><td>{z.description}</td><td>{z.accessConditions}</td><td>{z.envelopeWhenOperating?"Yes":"No"}</td></tr>)}</tbody>
            </table>
          </div>
        </Section>
      )}
      {(br.riderRestrictions||[]).length>0 && (
        <Section title="6. Rider Restrictions">
          <div style={{overflowX:"auto"}}>
            <table className="ctrl-table">
              <thead><tr><th>Category</th><th>Restriction</th><th>Rationale</th><th>Enforced By</th></tr></thead>
              <tbody>{br.riderRestrictions.map((r,i)=><tr key={i}><td><span className="br-tag" style={{background:"#e8f4f8",color:teal}}>{r.category}</span></td><td>{r.restriction}</td><td>{r.rationale}</td><td>{r.enforcedBy}</td></tr>)}</tbody>
            </table>
          </div>
        </Section>
      )}
      {(br.teamStructure||[]).length>0 && (
        <Section title="7. Team Structure">
          <div style={{overflowX:"auto"}}>
            <table className="ctrl-table">
              <thead><tr><th>Role</th><th>Count</th><th>Position</th><th>Responsibilities</th><th>Competency</th></tr></thead>
              <tbody>{br.teamStructure.map((r,i)=><tr key={i}><td style={{fontWeight:500}}>{r.role}</td><td>{r.count}</td><td>{r.position}</td><td>{(r.responsibilities||[]).join('; ')}</td><td>{r.competencyRequired}</td></tr>)}</tbody>
            </table>
          </div>
        </Section>
      )}
      {(br.weatherLimits||[]).length>0 && (
        <Section title="8. Weather Operational Limits">
          <div style={{overflowX:"auto"}}>
            <table className="ctrl-table">
              <thead><tr><th>Condition</th><th>Threshold</th><th>Required Action</th></tr></thead>
              <tbody>{br.weatherLimits.map((w,i)=><tr key={i}><td style={{fontWeight:500}}>{w.condition}</td><td>{w.threshold}</td><td>{w.action}</td></tr>)}</tbody>
            </table>
          </div>
        </Section>
      )}
      {br.adiDecisionFramework && (
        <Section title="9. ADI/ADH Decision Framework">
          <p style={{marginBottom:8}}>{br.adiDecisionFramework.boundaryStatement}</p>
          {[["Step 1 — Location",br.adiDecisionFramework.step1_location],["Step 2 — Device Involvement",br.adiDecisionFramework.step2_involvement],["Step 3 — Foreseeability (s 608B(2))",br.adiDecisionFramework.step3_foreseeability]].map(([lbl,val])=>(
            <p key={lbl} style={{marginBottom:6}}><strong style={{color:teal}}>{lbl}:</strong> {val}</p>
          ))}
          {(br.adiDecisionFramework.examples||[]).length>0 && (
            <div style={{marginTop:8,overflowX:"auto"}}>
              <table className="ctrl-table">
                <thead><tr><th>Scenario</th><th>Classification</th><th>Reasoning</th></tr></thead>
                <tbody>{br.adiDecisionFramework.examples.map((ex,i)=>{
                  const clr=ex.classification==="ADI"?"#c0392b":ex.classification==="ADH"?"#8e44ad":"#27ae60";
                  return <tr key={i}><td>{ex.scenario}</td><td><span style={{fontWeight:600,color:clr}}>{ex.classification}</span></td><td>{ex.reasoning}</td></tr>;
                })}</tbody>
              </table>
            </div>
          )}
        </Section>
      )}
      {br.referencedDocuments?.length>0 && (
        <Section title="10. Referenced Documents">
          {br.referencedDocuments.map((d,i)=><p key={i} style={{fontSize:13,margin:"2px 0"}}>• {d}</p>)}
        </Section>
      )}
      <div style={{background:"#fdf2f2",border:"1px solid #e8a09a",borderRadius:8,padding:"10px 14px",fontSize:12,color:"#922B21"}}>
        <strong>Disclaimer:</strong> This report is AI-generated and must be reviewed by a competent person before use in a Safety Case, regulatory submission, or operational decision-making.
      </div>
    </div>
  );
}

clearTimeout(window._loadTimer);
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
