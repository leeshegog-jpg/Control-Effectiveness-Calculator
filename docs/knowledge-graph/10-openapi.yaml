openapi: 3.1.0
info:
  title: TP Risk Management SMS — Safety Knowledge Graph Platform API
  version: 0.10.0-draft
  description: >
    DRAFT — controlled design document, requires approval before implementation.
    Backend REST surface for the Safety Knowledge Graph + AI Risk Intelligence Platform.
    Postgres is the system of record (03-postgresql-schema.sql); every write here is
    mirrored into Neo4j by the Graph Sync Service (01-enterprise-knowledge-graph-specification.md §4).
    See docs/PLATFORM_ARCHITECTURE_V2.md and docs/knowledge-graph/*.md for the design
    documents this contract implements.
    v0.2.0: Design Baseline v1.1 amendment — Emergency Planning (ACR-002) + Competency
    Management (ACR-003, supersedes ACR-001), approved 2026-08-04. Additive only —
    no removed/changed paths or schemas (02-development-standards.md §2 MINOR bump rule).
    v0.3.0: ACR-004 (approved 2026-08-11) — Investigation (1:1, INVESTIGATED_AS),
    incident-hazards linking (N:N, REVEALS, Option A bare-reference-list per ACR-004 §14),
    and incident-scoped Evidence. Drafted against ADR-003 (Investigation and Action are
    independent siblings of Incident, not a chain). Additive only — no removed/changed
    paths or schemas.
servers:
  - url: https://api.{environment}.vrtp-sms.example.net/v1
    variables:
      environment:
        default: dev
        enum: [dev, staging, prod]

security:
  - bearerAuth: []

tags:
  - name: Assets
  - name: Hazards
  - name: Risks
  - name: Controls
  - name: CriticalControls
  - name: Verification
  - name: Evidence
  - name: TARPs
  - name: Incidents
  - name: Actions
  - name: Audits
  - name: SafetyCase
  - name: Requirements
  - name: Documents
  - name: Extraction
  - name: Ontology
  - name: KnowledgeGraph
  - name: GapAnalysis
  - name: People
  - name: Competency   # v1.1 amendment — ACR-003 (approved 2026-08-04), supersedes ACR-001

paths:
  # ── Assets ────────────────────────────────────────────────────────────────────────
  /assets:
    get:
      tags: [Assets]
      summary: List assets
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - in: query
          name: park_id
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Paginated asset list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Asset' } }
                  total: { type: integer }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Assets]
      summary: Create an asset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetInput' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /assets/{id}:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [Assets]
      summary: Get an asset
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Assets]
      summary: Update an asset
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/AssetInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ── Device Boundary (11-safety-case-demonstration-model.md §2) ──────────────────────
  /assets/{id}/boundary:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [Assets]
      summary: Get the amusement device boundary for this asset (only valid where is_amusement_device = true)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceBoundary' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Assets]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/DeviceBoundaryInput' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceBoundary' } } } } }
  /assets/{id}/boundary/interfaces:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [Assets]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Interface' } } } } } }
    post:
      tags: [Assets]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/InterfaceInput' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Interface' } } } } }

  # ── Hazards ───────────────────────────────────────────────────────────────────────
  /hazards:
    get:
      tags: [Hazards]
      summary: List hazards
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - in: query
          name: asset_id
          schema: { type: string, format: uuid }
        - in: query
          name: category_concept_id
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Paginated hazard list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Hazard' } }
                  total: { type: integer }
    post:
      tags: [Hazards]
      summary: Create a hazard
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HazardInput' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Hazard' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /hazards/{id}:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [Hazards]
      summary: Get a hazard
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Hazard' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Hazards]
      summary: Update a hazard
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/HazardInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Hazard' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /hazards/{id}/duplicate-candidates:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [Hazards, GapAnalysis]
      summary: Duplicate hazard candidates for this hazard (07-inference-rules-catalogue.md R9)
      responses:
        '200':
          description: Candidate duplicates with similarity score
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    hazard: { $ref: '#/components/schemas/Hazard' }
                    similarity_score: { type: number, format: float }

  # ── ADH → ADI pathway (11-safety-case-demonstration-model.md §3) ────────────────────
  /hazards/{id}/credible-events:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [Hazards]
      summary: List credible events for this hazard (only meaningful where is_adh = true)
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CredibleEvent' } } } } } }
    post:
      tags: [Hazards]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/CredibleEventInput' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CredibleEvent' } } } } }

  # ── Safety Assessment (11-safety-case-demonstration-model.md §4) ────────────────────
  /safety-assessments:
    get:
      tags: [SafetyCase]
      parameters: [ { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/offset' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SafetyAssessment' } } } } } }
    post:
      tags: [SafetyCase]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/SafetyAssessmentInput' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SafetyAssessment' } } } } }
  /safety-assessments/{id}:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [SafetyCase]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SafetyAssessment' } } } } }
    patch:
      tags: [SafetyCase]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/SafetyAssessmentInput' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SafetyAssessment' } } } } }

  # ── Claim → Argument → Evidence (11-safety-case-demonstration-model.md §5) ──────────
  /safety-case-claims/{id}/arguments:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [SafetyCase]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SafetyArgument' } } } } } }
    post:
      tags: [SafetyCase]
      summary: Add a reasoning step connecting evidence to the claim (GSN Strategy-equivalent)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/SafetyArgumentInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SafetyArgument' } } } }
        '422': { description: "Cited evidence not reachable from the claim's SUPPORTS chain (06-relationship-rules-catalogue.md §5a GROUNDED_IN rule)" }

  # ── Monitoring (08-critical-control-assurance-model.md §5.1) ────────────────────────
  /critical-controls/{id}/monitoring-summaries:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [CriticalControls]
      parameters: [ { in: query, name: indicator_class, schema: { type: string, enum: [leading, lagging] } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MonitoringSummary' } } } } } }

  # ── Safety Case Demonstration Engine (11-safety-case-demonstration-model.md §7) ─────
  /demonstrations:
    post:
      tags: [SafetyCase]
      summary: Generate a new Demonstration (always status=draft — 11 §7.3)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [demonstration_type, scope_entity_type, scope_entity_id]
              properties:
                demonstration_type: { type: string, enum: [control_adequacy, hazard_to_assurance_chain, moc_effectiveness, governance_effectiveness, verification_confidence, evidence_support] }
                scope_entity_type: { type: string, enum: [safety_assessment, hazard, critical_control, asset] }
                scope_entity_id: { type: string, format: uuid }
      responses:
        '202': { description: Generation started, content: { application/json: { schema: { type: object, properties: { demonstration_id: { type: string, format: uuid } } } } } }
    get:
      tags: [SafetyCase]
      parameters:
        - { in: query, name: scope_entity_id, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string, enum: [draft, reviewed, approved, published] } }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Demonstration' } } } } } }
  /demonstrations/{id}:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [SafetyCase]
      summary: Get a demonstration, including staleness flag (07-inference-rules-catalogue.md R16)
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Demonstration' } } } } }
  /demonstrations/{id}/review:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    post:
      tags: [SafetyCase]
      summary: Advance draft → reviewed → approved → published (never automatic — 11 §7.3)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [reviewed, approved, published] }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Demonstration' } } } } }

  # ── Management of Change (11-safety-case-demonstration-model.md §7.2a) ──────────────
  /management-of-change:
    get:
      tags: [SafetyCase]
      parameters: [ { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/offset' }, { in: query, name: status, schema: { type: string, enum: [proposed, under_review, approved, implemented, closed] } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ManagementOfChange' } } } } } }
    post:
      tags: [SafetyCase]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ManagementOfChangeInput' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ManagementOfChange' } } } } }
  /management-of-change/{id}/review-triggers:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [SafetyCase]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ReviewTrigger' } } } } } }
    post:
      tags: [SafetyCase]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ReviewTriggerInput' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewTrigger' } } } } }

  # ── Emergency Planning (v1.1 amendment — ACR-002, approved 2026-08-04; sourced from
  # Guide §12) ──────────────────────────────────────────────────────────────────────
  /parks/{parkId}/emergency-plan:
    parameters: [ { name: parkId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [SafetyCase]
      summary: Get the park's one emergency plan (Guide §12.4 — one MAP, one plan)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/EmergencyPlan' } } } }
        '404': { description: No emergency plan exists yet for this park }
    put:
      tags: [SafetyCase]
      summary: Create or update the park's emergency plan (idempotent — one per park, park_id UNIQUE)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/EmergencyPlanInput' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/EmergencyPlan' } } } } }
  /emergency-plans/{id}/credible-events:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [SafetyCase]
      summary: List ADIs/credible events linked into this plan
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EmergencyPlanCredibleEvent' } } } } } }
    post:
      tags: [SafetyCase]
      summary: Link an ADI/credible event into this plan (Guide §12 — "linkages from your ADIs to the corresponding amusement device emergency plans")
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/EmergencyPlanCredibleEventInput' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/EmergencyPlanCredibleEvent' } } } } }
  /emergency-plans/{id}/exercises:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [SafetyCase]
      summary: List drills/exercises for this plan
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EmergencyExercise' } } } } } }
    post:
      tags: [SafetyCase]
      summary: Schedule or record an exercise (07-inference-rules-catalogue.md R22 tracks 12–18 month currency)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/EmergencyExerciseInput' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/EmergencyExercise' } } } } }
  /emergency-plans/{id}/consultations:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [SafetyCase]
      summary: List emergency service organisation consultations (Guide §12.2, §12.3)
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EmergencyServiceConsultation' } } } } } }
    post:
      tags: [SafetyCase]
      summary: Record a consultation with an emergency service organisation and how its recommendation was incorporated
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/EmergencyServiceConsultationInput' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/EmergencyServiceConsultation' } } } } }

  # ── Risks ─────────────────────────────────────────────────────────────────────────
  /risks:
    get:
      tags: [Risks]
      summary: List risks
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - in: query
          name: hazard_id
          schema: { type: string, format: uuid }
        - in: query
          name: current_rating
          schema: { type: string, enum: [Extreme, High, Medium, Low] }
      responses:
        '200':
          description: Paginated risk list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Risk' } }
                  total: { type: integer }
    post:
      tags: [Risks]
      summary: Create a risk (rating derived server-side — 07-inference-rules-catalogue.md R1)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RiskInput' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Risk' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /risks/{id}:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [Risks]
      summary: Get a risk
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Risk' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [Risks]
      summary: Update a risk. If current_rating is Extreme/High, sfarp_justification is validated (R4 SFARP gate).
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/RiskInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Risk' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: SFARP gate rejected the justification (07-inference-rules-catalogue.md R4) }

  # ── Controls & Critical Controls ─────────────────────────────────────────────────
  /risks/{riskId}/controls:
    parameters: [ { name: riskId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [Controls]
      summary: List controls mitigating this risk
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Control' } } } } }
    post:
      tags: [Controls]
      summary: Create a control candidate for this risk (pre 3-gate classification)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ControlInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Control' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /controls/{id}:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [Controls]
      summary: Get a control
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Control' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /controls/{id}/gate-test:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    post:
      tags: [Controls]
      summary: Submit 3-gate test answers (08-critical-control-assurance-model.md §2)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [gate_1, gate_2, gate_3]
              properties:
                gate_1: { type: boolean }
                gate_2: { type: boolean }
                gate_3: { type: boolean }
                is_verification_check: { type: boolean, description: "Follow-up if any gate failed" }
      responses:
        '200':
          description: Resulting classification
          content:
            application/json:
              schema:
                type: object
                properties:
                  classification: { type: string, enum: [Control, Support, Verification] }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /controls/{id}/eia-test:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    post:
      tags: [Controls]
      summary: Record the Effective/Independent/Auditable quick assessment (08-critical-control-assurance-model.md §4a, Guide Table 2) — distinct from the 3-gate classification test
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/ControlEiaInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Control' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /controls/{id}/critical-control-test:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    post:
      tags: [Controls, CriticalControls]
      summary: Submit critical control test answer (08 §3) — only valid if classification = Control
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [is_critical]
              properties:
                is_critical: { type: boolean }
      responses:
        '201':
          description: CriticalControl created
          content: { application/json: { schema: { $ref: '#/components/schemas/CriticalControl' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Control is not classified 'Control' — cannot be tested for criticality" }
        '422': { $ref: '#/components/responses/ValidationError' }
  /critical-controls/{id}:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [CriticalControls]
      summary: Get a critical control, including derived FARSI score and current health state (08-critical-control-assurance-model.md §6)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CriticalControl' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [CriticalControls]
      summary: Update FARSI scores (08 §4)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/CriticalControlFarsiInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CriticalControl' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /critical-controls/{id}/performance-standards:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [CriticalControls]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PerformanceStandard' } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [CriticalControls]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/PerformanceStandardInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PerformanceStandard' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /performance-standards/{id}/verification-activities:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [Verification]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/VerificationActivity' } } } } } }
    post:
      tags: [Verification]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/VerificationActivityInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/VerificationActivity' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /verification-activities/{id}/evidence:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [Evidence]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Evidence' } } } } } }
    post:
      tags: [Evidence]
      summary: Attach evidence to a completed verification activity
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/EvidenceInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Evidence' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /critical-controls/{id}/tarps:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [TARPs]
      summary: List Trigger Action Response Plans for this critical control (08 §7)
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TARP' } } } } } }
    post:
      tags: [TARPs]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/TARPInput' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TARP' } } } } }
  /tarps/{id}/resolve:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    post:
      tags: [TARPs]
      summary: Mark a triggered TARP resolved
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TARP' } } } } }

  # ── Incidents / Actions / Audits ─────────────────────────────────────────────────
  /incidents:
    get:
      tags: [Incidents]
      parameters: [ { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/offset' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Incident' } }, total: { type: integer } } } } } } }
    post:
      tags: [Incidents]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/IncidentInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Incident' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /incidents/{id}:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [Incidents]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Incident' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [Incidents]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/IncidentInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Incident' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /incidents/{id}/run-investigation-pipeline:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    post:
      tags: [Incidents, Extraction]
      summary: >
        Trigger the Investigation Agent → Compliance Agent → Safety Case Trigger pipeline
        (04-ai-extraction-specification.md §7 — server-side successor to V1's
        local-automation PowerShell pipeline)
      responses:
        '202':
          description: Pipeline started
          content:
            application/json:
              schema: { type: object, properties: { extraction_run_id: { type: string, format: uuid } } }

  # ── ACR-004 (Approved 2026-08-11) — Investigation, hazard-linking, incident Evidence ──
  # Drafted against ADR-003: Investigation and Action are independent siblings of
  # Incident, not a chain. See 18-r1-milestone-3a-incident-discovery-reconciliation.md
  # §5 and 19-r1-milestone-3b-incident-decision-register.md D4.
  /incidents/{id}/investigation:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [Incidents]
      summary: Get the investigation for this incident (1:1 — INVESTIGATED_AS, ADR-003)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Investigation' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Incidents]
      summary: Create the investigation for this incident
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/InvestigationInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Investigation' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Investigation already exists for this incident (investigations.incident_id UNIQUE)" }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [Incidents]
      summary: Update the investigation for this incident
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/InvestigationInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Investigation' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /incidents/{id}/hazards:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [Incidents, Hazards]
      summary: List hazards this incident revealed (REVEALS, N:N — safety.incident_hazards)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Hazard' } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Incidents, Hazards]
      summary: >
        Link a hazard this incident revealed (ACR-004 Option A — bare reference,
        no IncidentHazard schema; safety.incident_hazards has no columns beyond
        the incident_id/hazard_id composite key)
      requestBody: { content: { application/json: { schema: { type: object, required: [hazard_id], properties: { hazard_id: { type: string, format: uuid } } } } } }
      responses:
        '201': { description: Linked }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /incidents/{id}/hazards/{hazardId}:
    parameters:
      - { $ref: '#/components/parameters/id' }
      - { name: hazardId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Incidents, Hazards]
      summary: Unlink a hazard from this incident
      responses:
        '204': { description: Unlinked }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /incidents/{id}/evidence:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [Evidence]
      summary: List evidence attached to this incident (safety.evidence.linked_entity_type = 'incident')
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Evidence' } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Evidence]
      summary: Attach evidence to this incident
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/EvidenceInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Evidence' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /incidents/{id}/actions:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [Incidents, Actions]
      summary: List Actions linked to this incident's linked-CAR roster (TRIGGERS, 1:N — safety.incident_actions; V1 fCARs)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Action' } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Incidents, Actions]
      summary: >
        Link an existing Action to this incident's roster (ACR-006 Option A — bare reference,
        no IncidentAction schema; safety.incident_actions has no columns beyond the
        incident_id/action_id composite key. Does not create an Action — use POST /actions
        for creation.)
      requestBody: { content: { application/json: { schema: { type: object, required: [action_id], properties: { action_id: { type: string, format: uuid } } } } } }
      responses:
        '201': { description: Linked }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /incidents/{id}/actions/{actionId}:
    parameters:
      - { $ref: '#/components/parameters/id' }
      - { name: actionId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Incidents, Actions]
      summary: Unlink an Action from this incident's roster
      responses:
        '204': { description: Unlinked }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /actions:
    get:
      tags: [Actions]
      parameters: [ { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/offset' }, { in: query, name: status, schema: { type: string, enum: [Open, In Progress, Closed] } } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Action' } } } } } }
    post:
      tags: [Actions]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ActionInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Action' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /actions/{id}:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    patch:
      tags: [Actions]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ActionInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Action' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /audits:
    get:
      tags: [Audits]
      parameters: [ { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/offset' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Audit' } } } } } }
    post:
      tags: [Audits]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/AuditInput' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Audit' } } } } }
  /audits/{id}/findings:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [Audits]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AuditFinding' } } } } } }
    post:
      tags: [Audits]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/AuditFindingInput' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AuditFinding' } } } } }

  # ── Safety Case & Requirements ────────────────────────────────────────────────────
  /safety-case-claims:
    get:
      tags: [SafetyCase]
      parameters: [ { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/offset' } ]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SafetyCaseClaim' } } } } } }
    post:
      tags: [SafetyCase]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/SafetyCaseClaimInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SafetyCaseClaim' } } } }
        '422': { description: "Chain consistency violation (06-relationship-rules-catalogue.md §3 SUPPORTS rule) — cited evidence does not trace to the claimed hazard/critical control" }
  /safety-case-claims/{id}:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [SafetyCase]
      summary: Get a claim with full traceability chain and effective confidence (05-knowledge-provenance-model.md §4)
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SafetyCaseClaimDetail' } } } } }
  /requirements:
    get:
      tags: [Requirements]
      parameters:
        - { in: query, name: source_concept_id, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string, enum: [TO_BE_CONFIRMED, confirmed] } }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Requirement' } } } } } }
  /requirements/{id}/coverage:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [Requirements, GapAnalysis]
      summary: Claims tracing to this requirement (empty result = coverage gap, 07-inference-rules-catalogue.md R11)
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SafetyCaseClaim' } } } } } }

  # ── Documents & Extraction ────────────────────────────────────────────────────────
  /documents:
    post:
      tags: [Documents]
      summary: Upload a document for AI extraction (04-ai-extraction-specification.md §2)
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { description: Uploaded, content: { application/json: { schema: { $ref: '#/components/schemas/Document' } } } }
  /documents/{id}:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [Documents]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Document' } } } } }
  /documents/{id}/extract:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    post:
      tags: [Extraction]
      summary: Start an extraction run against this document
      responses:
        '202': { description: Started, content: { application/json: { schema: { type: object, properties: { extraction_run_id: { type: string, format: uuid } } } } } }
  /extraction-runs/{id}:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [Extraction]
      summary: Extraction run status and draft results (04-ai-extraction-specification.md §2, §6)
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ExtractionRun' } } } } }
  /extraction-runs/{id}/drafts/{draftId}/approve:
    parameters:
      - { $ref: '#/components/parameters/id' }
      - { name: draftId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Extraction]
      summary: Approve a flagged draft — commits to Postgres with human_entry-tier provenance override (05-knowledge-provenance-model.md)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                edits: { type: object, description: "Optional field edits applied before commit" }
      responses: { '200': { description: Committed, content: { application/json: { schema: { type: object, properties: { entity_type: { type: string }, entity_id: { type: string, format: uuid } } } } } } }
  /extraction-runs/{id}/drafts/{draftId}/reject:
    parameters:
      - { $ref: '#/components/parameters/id' }
      - { name: draftId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Extraction]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { reason: { type: string } } } } }
      responses: { '200': { description: Rejected } }

  # ── Ontology ──────────────────────────────────────────────────────────────────────
  /ontology/schemes:
    get:
      tags: [Ontology]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OntologyScheme' } } } } } }
  /ontology/concepts:
    get:
      tags: [Ontology]
      summary: List/search concepts (used for extraction prompt construction — 04 §5 — and form autocomplete)
      parameters:
        - { in: query, name: scheme_id, schema: { type: string, format: uuid } }
        - { in: query, name: q, schema: { type: string }, description: "Search pref_label + aliases" }
        - { in: query, name: status, schema: { type: string, enum: [draft, reviewed, approved, published, deprecated] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Concept' } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Ontology]
      summary: Propose a new concept (curator workflow — 01-enterprise-knowledge-graph-specification.md §6)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ConceptInput' } } } }
      responses: { '201': { description: Created as draft, content: { application/json: { schema: { $ref: '#/components/schemas/Concept' } } } } }
  /ontology/concepts/{id}/publish:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    post:
      tags: [Ontology]
      summary: Curator approval — advances draft/reviewed/approved → published
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Concept' } } } } }
  /ontology/concepts/{id}/aliases:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    post:
      tags: [Ontology]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ConceptAliasInput' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ConceptAlias' } } } } }
  /ontology/extraction-rules:
    get:
      tags: [Ontology, Extraction]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ExtractionRule' } } } } } }
    post:
      tags: [Ontology, Extraction]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ExtractionRuleInput' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ExtractionRule' } } } } }

  # ── Knowledge Graph & Gap Analysis ────────────────────────────────────────────────
  /graph/query/{patternId}:
    parameters:
      - name: patternId
        in: path
        required: true
        schema: { type: string, enum: [Q1_critical_risk_assurance, Q2_controls_by_hazard_type, Q3_overdue_critical_controls, Q4_duplicate_hazards, Q5_safety_case_traceability, Q6_incident_impact, Q7_regulatory_coverage_gaps] }
        description: Named query patterns only (01-enterprise-knowledge-graph-specification.md §5) — no arbitrary Cypher accepted from clients
    post:
      tags: [KnowledgeGraph]
      summary: Execute a named, parameterized graph query pattern
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: >-
                Pattern-specific parameters, e.g. an asset_id value for Q2
      responses:
        '200':
          description: Graph result (nodes + edges, Cytoscape-ready)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphResult' }
  /gap-analysis/findings:
    get:
      tags: [GapAnalysis]
      summary: Findings from 07-inference-rules-catalogue.md rules R3, R5, R6, R8, R9, R11, R12, R14, R16, R17, R18
      parameters:
        - in: query
          name: rule
          schema: { type: string, enum: [R3, R5, R6, R8, R9, R11, R12, R14, R16, R17, R18] }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GapFinding' }

  # ── People / Parks ────────────────────────────────────────────────────────────────
  /persons:
    get:
      tags: [People]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Person' } } } } } }
    post:
      tags: [People]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/PersonInput' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Person' } } } } }
  /parks:
    get:
      tags: [People]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Park' } } } } } }

  # ── Competency Management (v1.1 amendment — ACR-003, approved 2026-08-04, supersedes
  # ACR-001; sourced from Guide §10.8) ──────────────────────────────────────────────
  /roles:
    get:
      tags: [Competency]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Role' } } } } } }
    post:
      tags: [Competency]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/RoleInput' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Role' } } } } }
  /competencies:
    get:
      tags: [Competency]
      summary: List competency claims
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - in: query
          name: person_id
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string, enum: [current, lapsed, pending_assessment, revoked] }
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Competency' } } } } } }
    post:
      tags: [Competency]
      summary: Record a competency claim (training is one competency_type value — no separate Training entity, per ACR-003)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/CompetencyInput' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Competency' } } } } }
  /competencies/{id}:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [Competency]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Competency' } } } } }
    patch:
      tags: [Competency]
      summary: Update a competency claim (e.g. assessment result, currency_expiry_date). 07-inference-rules-catalogue.md R19 lapses it automatically once expired.
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/CompetencyInput' } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Competency' } } } } }
  /competencies/{id}/evidence:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [Competency]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Evidence' } } } } } }
    post:
      tags: [Competency]
      summary: Link supporting evidence (training record, licence, assessment result) to this competency claim
      requestBody: { content: { application/json: { schema: { type: object, required: [evidence_id], properties: { evidence_id: { type: string, format: uuid } } } } } }
      responses: { '201': { description: Created } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "AuthN/AuthZ provider TO BE CONFIRMED (architecture §2 AuthZ component) — Azure AD / Entra ID is the natural default given Azure hosting (architecture §8) but not yet decided."

  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    limit:
      name: limit
      in: query
      schema: { type: integer, default: 50, maximum: 200 }
    offset:
      name: offset
      in: query
      schema: { type: integer, default: 0 }

  responses:
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationError:
      description: Request failed validation
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }

    ConceptRef:
      type: object
      description: Reference to an ontology concept (03-postgresql-schema.sql ontology.concepts)
      properties:
        concept_id: { type: string, format: uuid, nullable: true }
        pref_label: { type: string, description: "Read-only, resolved server-side", nullable: true }

    Park:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    Person:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role_title: { type: string }
        email: { type: string, format: email }
    PersonInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        role_title: { type: string }
        email: { type: string, format: email }

    Asset:
      allOf:
        - $ref: '#/components/schemas/AssetInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    AssetInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        park_id: { type: string, format: uuid }
        asset_type: { $ref: '#/components/schemas/ConceptRef' }
        iso55000_class: { type: string, description: "TO BE CONFIRMED — see PLATFORM_ARCHITECTURE_V2.md §5", nullable: true }
        status: { type: string, default: active }

    Hazard:
      allOf:
        - $ref: '#/components/schemas/HazardInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    HazardInput:
      type: object
      required: [name, description]
      properties:
        asset_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        description: { type: string }
        exposure_pathway: { type: string, nullable: true }
        possible_consequence: { type: string, nullable: true }
        category: { $ref: '#/components/schemas/ConceptRef' }
        energy_source: { $ref: '#/components/schemas/ConceptRef' }
        date_identified: { type: string, format: date }
        owner_person_id: { type: string, format: uuid }
        is_adh: { type: boolean, default: false, description: "Amusement device hazard — 11-safety-case-demonstration-model.md §3" }
        device_boundary_id: { type: string, format: uuid, nullable: true }

    Risk:
      allOf:
        - $ref: '#/components/schemas/RiskInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            inherent_rating: { type: string, enum: [Extreme, High, Medium, Low], readOnly: true, description: "Derived — 07-inference-rules-catalogue.md R1", nullable: true }
            current_rating: { type: string, enum: [Extreme, High, Medium, Low], readOnly: true, nullable: true }
    RiskInput:
      type: object
      required: [hazard_id, description]
      properties:
        hazard_id: { type: string, format: uuid }
        description: { type: string }
        cause: { type: string, nullable: true }
        inherent_likelihood: { type: integer, minimum: 1, maximum: 5 }
        inherent_consequence: { type: integer, minimum: 1, maximum: 5 }
        current_likelihood: { type: integer, minimum: 1, maximum: 5 }
        current_consequence: { type: integer, minimum: 1, maximum: 5 }
        target_likelihood: { type: integer, minimum: 1, maximum: 5 }
        target_consequence: { type: integer, minimum: 1, maximum: 5 }
        sfarp_justification: { type: string, description: "General WHS duty justification. For ADI/Chapter-9A-scoped risks, use serious_risk_justification and SFAIRP terminology in any generated Demonstration text — 09-regulatory-knowledge-model.md §3", nullable: true }
        status: { type: string, enum: [Open, Under Review, Closed] }
        review_date: { type: string, format: date }
        is_serious_risk: { type: boolean, default: false, description: "Chapter 9A serious risk classification (WHS Reg s.608B(1)(b)) — operator-defined threshold, see 09-regulatory-knowledge-model.md §6" }
        serious_risk_justification: { type: string, nullable: true }

    Control:
      allOf:
        - $ref: '#/components/schemas/ControlInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            classification: { type: string, enum: [Control, Support, Verification], readOnly: true, nullable: true }
            is_critical: { type: boolean, readOnly: true }
    ControlInput:
      type: object
      required: [risk_id, description, control_type]
      properties:
        risk_id: { type: string, format: uuid }
        description: { type: string }
        control_type: { type: string, enum: [Prevention, Mitigation] }
        hierarchy: { $ref: '#/components/schemas/ConceptRef' }
        owner_person_id: { type: string, format: uuid }
        effectiveness_rating: { type: string, nullable: true }

    CriticalControl:
      type: object
      properties:
        control_id: { type: string, format: uuid }
        farsi_functionality: { type: integer, minimum: 1, maximum: 5 }
        farsi_availability: { type: integer, minimum: 1, maximum: 5 }
        farsi_reliability: { type: integer, minimum: 1, maximum: 5 }
        farsi_survivability: { type: integer, minimum: 1, maximum: 5 }
        farsi_interdependency: { type: integer, minimum: 1, maximum: 5, description: "Corrected from 'interaction' — confirmed against WHSQ Guide 2021 §5/§9.2.2.1 (08-critical-control-assurance-model.md §4b)" }
        farsi_score: { type: number, format: float, readOnly: true }
        eia_effective: { type: boolean, description: "Guide Table 2 — 08-critical-control-assurance-model.md §4a" }
        eia_independent: { type: boolean }
        eia_auditable: { type: boolean }
        health_state: { type: string, enum: [Verified, Healthy, Degraded, Overdue, Unverified], readOnly: true, description: "Computed — 08-critical-control-assurance-model.md §6" }
    CriticalControlFarsiInput:
      type: object
      properties:
        farsi_functionality: { type: integer, minimum: 1, maximum: 5 }
        farsi_availability: { type: integer, minimum: 1, maximum: 5 }
        farsi_reliability: { type: integer, minimum: 1, maximum: 5 }
        farsi_survivability: { type: integer, minimum: 1, maximum: 5 }
        farsi_interdependency: { type: integer, minimum: 1, maximum: 5 }
    ControlEiaInput:
      type: object
      description: "08-critical-control-assurance-model.md §4a — Guide Table 2"
      properties:
        eia_effective: { type: boolean }
        eia_independent: { type: boolean }
        eia_auditable: { type: boolean }

    PerformanceStandard:
      allOf:
        - $ref: '#/components/schemas/PerformanceStandardInput'
        - type: object
          properties: { id: { type: string, format: uuid } }
    PerformanceStandardInput:
      type: object
      required: [requirement_text]
      properties:
        requirement_text: { type: string }
        measurable_criteria: { type: string, nullable: true }

    VerificationActivity:
      allOf:
        - $ref: '#/components/schemas/VerificationActivityInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            overdue: { type: boolean, readOnly: true, description: "07-inference-rules-catalogue.md R3" }
    VerificationActivityInput:
      type: object
      properties:
        method: { $ref: '#/components/schemas/ConceptRef' }
        frequency: { type: string, enum: [Daily, Weekly, Fortnightly, Monthly, Quarterly, Annual, Biennial, Other], nullable: true }
        due_date: { type: string, format: date }
        last_completed: { type: string, format: date }
        performed_by_person_id: { type: string, format: uuid }
        result: { type: string, nullable: true }

    Evidence:
      allOf:
        - $ref: '#/components/schemas/EvidenceInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            uploaded_at: { type: string, format: date-time }
    EvidenceInput:
      type: object
      properties:
        type: { $ref: '#/components/schemas/ConceptRef' }
        source_document_id: { type: string, format: uuid }
        uploaded_by_person_id: { type: string, format: uuid }
        linked_entity_type: { type: string, nullable: true }
        linked_entity_id: { type: string, format: uuid }

    TARP:
      allOf:
        - $ref: '#/components/schemas/TARPInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [active, triggered, resolved, retired] }
    TARPInput:
      type: object
      required: [trigger_condition, required_action]
      properties:
        trigger_condition: { type: string }
        trigger_source_rule: { type: string, enum: [R3, R5, R6, R8, R9, R11, R12, R14, R16, R17, R18] }
        required_action: { type: string }
        response_owner_person_id: { type: string, format: uuid }
        escalation_level: { type: string, enum: [supervisor, manager, executive] }

    Incident:
      allOf:
        - $ref: '#/components/schemas/IncidentInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
    IncidentInput:
      type: object
      required: [datetime, description]
      properties:
        datetime: { type: string, format: date-time }
        incident_type: { $ref: '#/components/schemas/ConceptRef' }
        severity: { type: integer, minimum: 1, maximum: 5 }
        vrtp_severity: { type: string, enum: ["First Aid", "Medical Treatment Injury", "Lost Time Injury", "Serious Injury", "Dangerous Incident", "Near Miss"], nullable: true }
        location: { type: string, nullable: true }
        asset_id: { type: string, format: uuid }
        reporter_person_id: { type: string, format: uuid }
        description: { type: string }
        injuries: { type: string, nullable: true }
        witnesses: { type: string, nullable: true }
        immediate_actions: { type: string, nullable: true }
        immediate_cause: { type: string, nullable: true }
        root_cause: { type: string, nullable: true }
        whsq_notified: { type: string, enum: ["Not yet assessed", "Yes", "No - assessed not required", "No - under assessment"] }
        osr_notified: { type: string, enum: ["Not applicable / under assessment", "Yes", "No - assessed not required", "No - under assessment"], description: "Chapter 9A — see 09-regulatory-knowledge-model.md §4" }
        investigation_status: { type: string, enum: [Not Started, In Progress, Complete] }
        status: { type: string, enum: [Open, Under Investigation, Closed] }
        # ── ACR-005 (Approved 2026-08-12) ──────────────────────────────────────────────
        is_notifiable_incident: { type: boolean, default: false, description: "WHS Act 2011 s.35 notifiable-incident determination (death / s.36 serious injury / s.37 dangerous incident) — operator-determined, see ADR-006 §9" }

    # ── ACR-004 (Approved 2026-08-11) ──────────────────────────────────────────────────
    Investigation:
      allOf:
        - $ref: '#/components/schemas/InvestigationInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            incident_id: { type: string, format: uuid, readOnly: true }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    InvestigationInput:
      type: object
      properties:
        method: { type: string, description: "TO BE CONFIRMED — ICAM or VRTP-mandated equivalent (03-postgresql-schema.sql investigations.method; docs/knowledge-graph/README.md open item)", nullable: true }
        findings: { type: string, nullable: true }
        contributing_factors: { type: string, nullable: true }

    Action:
      allOf:
        - $ref: '#/components/schemas/ActionInput'
        - type: object
          properties: { id: { type: string, format: uuid } }
    ActionInput:
      type: object
      required: [description]
      properties:
        source_type: { $ref: '#/components/schemas/ConceptRef' }
        source_id: { type: string, format: uuid }
        description: { type: string }
        root_cause_category: { $ref: '#/components/schemas/ConceptRef' }
        priority: { type: string, enum: [Critical, High, Medium, Low], nullable: true }
        assigned_to_person_id: { type: string, format: uuid }
        due_date: { type: string, format: date }
        status: { type: string, enum: [Open, In Progress, Closed] }
        effectiveness_review: { type: string, enum: ["Not Reviewed", Effective, "Partially Effective", Ineffective] }
        completion_date: { type: string, format: date }
        notes: { type: string, nullable: true }

    Audit:
      allOf:
        - $ref: '#/components/schemas/AuditInput'
        - type: object
          properties: { id: { type: string, format: uuid } }
    AuditInput:
      type: object
      required: [audit_type, title]
      properties:
        audit_type: { type: string, enum: ["Internal Audit", "External Audit", "Site Inspection", "Management Review", "Regulatory Inspection", "Other"] }
        title: { type: string }
        scope: { type: string }
        planned_date: { type: string, format: date }
        actual_date: { type: string, format: date }
        auditor_person_id: { type: string, format: uuid }
        area: { type: string }
        status: { type: string, enum: [Planned, "In Progress", Complete, Cancelled] }

    AuditFinding:
      allOf:
        - $ref: '#/components/schemas/AuditFindingInput'
        - type: object
          properties: { id: { type: string, format: uuid } }
    AuditFindingInput:
      type: object
      required: [description]
      properties:
        severity: { type: string }
        description: { type: string }

    SafetyCaseClaim:
      allOf:
        - $ref: '#/components/schemas/SafetyCaseClaimInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            assurance_status: { type: string }
    SafetyCaseClaimInput:
      type: object
      required: [claim_text]
      properties:
        hazard_id: { type: string, format: uuid }
        critical_control_id: { type: string, format: uuid }
        claim_text: { type: string }
        evidence_ids: { type: array, items: { type: string, format: uuid } }
        requirement_ids: { type: array, items: { type: string, format: uuid } }
    SafetyCaseClaimDetail:
      allOf:
        - $ref: '#/components/schemas/SafetyCaseClaim'
        - type: object
          properties:
            effective_confidence: { type: number, format: float, description: "05-knowledge-provenance-model.md §4" }
            unresolved_segments: { type: array, items: { type: string } }
            chain: { $ref: '#/components/schemas/GraphResult' }

    Requirement:
      type: object
      properties:
        id: { type: string, format: uuid }
        source: { $ref: '#/components/schemas/ConceptRef' }
        clause_ref: { type: string }
        text: { type: string }
        applies_to_entity_type: { type: string }
        status: { type: string, enum: [TO_BE_CONFIRMED, confirmed] }

    Document:
      type: object
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        mime_type: { type: string }
        uploaded_at: { type: string, format: date-time }
        extraction_status: { type: string, enum: [pending, processing, extracted, failed, reviewed] }

    ExtractionRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        status: { type: string, enum: [running, complete, failed] }
        drafts:
          type: array
          items: { $ref: '#/components/schemas/ExtractionDraft' }
    ExtractionDraft:
      type: object
      description: "Matches 04-ai-extraction-specification.md §4 schema"
      properties:
        id: { type: string, format: uuid }
        source_span: { type: object }
        payload: { type: object, description: "Hazard/Risk/Controls/Verification/Evidence draft — full shape in 04-ai-extraction-specification.md §4" }
        overall_confidence: { type: number, format: float }
        routing: { type: string, enum: [auto-accept, flag-for-review, reject] }

    OntologyScheme:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        version: { type: integer }

    Concept:
      allOf:
        - $ref: '#/components/schemas/ConceptInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [draft, reviewed, approved, published, deprecated] }
    ConceptInput:
      type: object
      required: [scheme_id, pref_label]
      properties:
        scheme_id: { type: string, format: uuid }
        parent_concept_id: { type: string, format: uuid, nullable: true }
        pref_label: { type: string }
        definition: { type: string, nullable: true }
        source_ref: { type: string, nullable: true }

    ConceptAlias:
      allOf:
        - $ref: '#/components/schemas/ConceptAliasInput'
        - type: object
          properties: { id: { type: string, format: uuid } }
    ConceptAliasInput:
      type: object
      required: [alias_text]
      properties:
        alias_text: { type: string }
        alias_type: { type: string, enum: [synonym, abbreviation, deprecated_term] }

    ExtractionRule:
      allOf:
        - $ref: '#/components/schemas/ExtractionRuleInput'
        - type: object
          properties: { id: { type: string, format: uuid } }
    ExtractionRuleInput:
      type: object
      required: [target_concept_id, pattern_type, confidence_threshold, action]
      properties:
        target_concept_id: { type: string, format: uuid }
        pattern_type: { type: string, enum: [regex, embedding-similarity, llm-prompt-instruction] }
        confidence_threshold: { type: number, format: float, minimum: 0, maximum: 1 }
        action: { type: string, enum: [auto-accept, flag-for-review, reject] }
        example_positive: { type: string }
        example_negative: { type: string }

    GapFinding:
      type: object
      properties:
        rule: { type: string, enum: [R3, R5, R6, R8, R9, R11, R12, R14, R16, R17, R18] }
        entity_type: { type: string }
        entity_id: { type: string, format: uuid }
        summary: { type: string }
        detected_at: { type: string, format: date-time }

    GraphResult:
      type: object
      properties:
        nodes:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              properties: { type: object, additionalProperties: true }
        edges:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              source: { type: string }
              target: { type: string }
              properties: { type: object, additionalProperties: true }

    # ── Safety Case Demonstration Model (11-safety-case-demonstration-model.md) ────────
    DeviceBoundary:
      allOf:
        - $ref: '#/components/schemas/DeviceBoundaryInput'
        - type: object
          properties: { id: { type: string, format: uuid } }
    DeviceBoundaryInput:
      type: object
      required: [boundary_description]
      properties:
        boundary_description: { type: string }
        includes_description: { type: string }
        excludes_description: { type: string }

    Interface:
      allOf:
        - $ref: '#/components/schemas/InterfaceInput'
        - type: object
          properties: { id: { type: string, format: uuid } }
    InterfaceInput:
      type: object
      required: [interface_type, description]
      properties:
        interface_type: { type: string, enum: [external_hazard, internal_hazard, worker_interaction, patron_interaction, supporting_system, utility, environment] }
        description: { type: string }

    CredibleEvent:
      allOf:
        - $ref: '#/components/schemas/CredibleEventInput'
        - type: object
          properties: { id: { type: string, format: uuid } }
    CredibleEventInput:
      type: object
      required: [description]
      properties:
        risk_id: { type: string, format: uuid, nullable: true }
        description: { type: string }
        loss_of_control_description: { type: string }
        is_adi: { type: boolean, default: false }

    SafetyAssessment:
      allOf:
        - $ref: '#/components/schemas/SafetyAssessmentInput'
        - type: object
          properties: { id: { type: string, format: uuid } }
    SafetyAssessmentInput:
      type: object
      required: [device_boundary_id, scope_description]
      properties:
        device_boundary_id: { type: string, format: uuid }
        scope_description: { type: string }
        serious_risk_threshold_note: { type: string, description: "Operator's documented interpretation — not a fixed number, see 09-regulatory-knowledge-model.md §6" }
        unmitigated_risk_method: { type: string }
        status: { type: string, default: draft }
        prepared_by_person_id: { type: string, format: uuid }
        assessment_date: { type: string, format: date }

    SafetyArgument:
      allOf:
        - $ref: '#/components/schemas/SafetyArgumentInput'
        - type: object
          properties: { id: { type: string, format: uuid } }
    SafetyArgumentInput:
      type: object
      required: [argument_text]
      properties:
        argument_text: { type: string, description: "The reasoning connecting evidence to the claim — GSN Strategy-equivalent" }
        sequence: { type: integer, default: 1 }
        evidence_ids: { type: array, items: { type: string, format: uuid }, description: "Must be a subset of evidence already SUPPORTS-linked to the parent claim" }

    MonitoringSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        verification_count: { type: integer }
        pass_count: { type: integer }
        trend: { type: string, enum: [improving, stable, declining] }
        indicator_class: { type: string, enum: [leading, lagging], description: "08-critical-control-assurance-model.md §5.1" }
        summary_text: { type: string }
        generated_at: { type: string, format: date-time }

    Demonstration:
      type: object
      properties:
        id: { type: string, format: uuid }
        demonstration_type: { type: string, enum: [control_adequacy, hazard_to_assurance_chain, moc_effectiveness, governance_effectiveness, verification_confidence, evidence_support] }
        scope_entity_type: { type: string }
        scope_entity_id: { type: string, format: uuid }
