# Ephemeral stack for CI integration tests (docs/implementation-blueprint/07-cicd-architecture.md §3).
# No named volumes -- reset per run, never production-like data.
name: sms-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: sms
      POSTGRES_DB: sms_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms -d sms_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/test-password
    ports:
      - "7475:7474"
      - "7688:7687"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6334:6333"
    tmpfs:
      - /qdrant/storage

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://sms:sms@postgres:5432/sms_test
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: test-password
      QDRANT_URL: http://qdrant:6333
      ENVIRONMENT: test
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
