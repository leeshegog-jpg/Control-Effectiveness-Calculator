name: PR Validation

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build-lint-format:
    name: Web — build, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Not `npm ci`: the lockfile was generated on Windows and npm has a
      # known bug (npm/cli#4828) resolving platform-specific optional
      # dependencies (e.g. @rolldown/binding-*) cross-platform via `ci`'s
      # strict lockfile install. `npm install` re-resolves optional deps
      # for the runner's actual platform.
      - run: npm install
      - run: npm run build:web
      - run: npm run lint:web
      - run: npm run format:check:web

  packages-build:
    name: Shared packages — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Not `npm ci`: the lockfile was generated on Windows and npm has a
      # known bug (npm/cli#4828) resolving platform-specific optional
      # dependencies (e.g. @rolldown/binding-*) cross-platform via `ci`'s
      # strict lockfile install. `npm install` re-resolves optional deps
      # for the runner's actual platform.
      - run: npm install
      - run: npm run build --workspace packages/shared-types
      - run: npm run build --workspace packages/api-client
      - run: npm run build --workspace packages/ontology-client
      - run: npm run build --workspace packages/ui-components

  api-lint-typecheck-test:
    name: API — lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "apps/api[dev]"
      - run: ruff check apps/api/app
      - run: ruff format --check apps/api/app
      - run: mypy apps/api/app
      - run: pytest tests/unit -v

  openapi-validate:
    name: OpenAPI contract validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/validate_openapi.py
      - name: Fail if shared-types is stale
        run: |
          if git diff --name-only ${{ github.event.pull_request.base.sha || 'HEAD~1' }} -- docs/knowledge-graph/10-openapi.yaml | grep -q .; then
            if ! git diff --name-only ${{ github.event.pull_request.base.sha || 'HEAD~1' }} -- packages/shared-types | grep -q .; then
              echo "::warning::10-openapi.yaml changed but packages/shared-types was not regenerated in this PR."
            fi
          fi
        continue-on-error: true

  ontology-validate:
    name: Ontology validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/validate_ontology.py

  graph-validate:
    name: Graph relationship-rule tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "apps/api[dev]"
      - run: python scripts/run_graph_tests.py

  integration-tests:
    name: Integration tests (Postgres + Neo4j)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sms
          POSTGRES_PASSWORD: sms
          POSTGRES_DB: sms_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sms -d sms_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/dev-password-change-me
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p dev-password-change-me 'RETURN 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://sms:sms@localhost:5432/sms_dev
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: dev-password-change-me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "apps/api[dev]"
      - run: pip install -r scripts/requirements.txt
      # Real schema from the frozen Design Baseline, not a re-derived one --
      # see database/postgres/migrations/versions/0001_initial_schema.py.
      - run: alembic upgrade head
      - run: python scripts/seed_ontology.py
      - run: pytest tests/integration -v
