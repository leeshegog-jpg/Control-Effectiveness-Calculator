name: Merge-to-Main Build

on:
  push:
    branches: [main]

jobs:
  container-build:
    name: Container build — ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: sms-${{ matrix.app }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Integration tests, Knowledge Graph validation, and auto-deploy-to-Dev
  # (docs/implementation-blueprint/07-cicd-architecture.md §3, steps 2-4) are
  # not wired at R0 -- no business logic exists yet for integration tests to
  # exercise, and no environment is provisioned yet (infrastructure/ is
  # scaffolding only, see infrastructure/README.md). Added at R0 exit / R1.
