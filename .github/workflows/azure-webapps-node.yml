# Deploy static HTML/CSS/JS site to Azure Web App
# Triggered on push to main or manually via workflow_dispatch.
#
# Setup:
# 1. Create an Azure Web App (Linux, any runtime — this is a static site).
# 2. Download the Publish Profile from the Web App Overview page in the Azure Portal.
# 3. Add it as a repository secret named AZURE_WEBAPP_PUBLISH_PROFILE.
# 4. Set AZURE_WEBAPP_NAME below to your app's name.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: your-app-name       # replace with your Azure Web App name
  AZURE_WEBAPP_PACKAGE_PATH: '.'

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: .
          if-no-files-found: error

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: ./deploy

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./deploy
