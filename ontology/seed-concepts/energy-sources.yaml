# Ported from bowtie-ccm-generator.html REF.identificationMethods "Energy
# Analysis" method: "Map every energy type present: kinetic, potential,
# electrical, thermal, chemical, pressure, radiation, biological, acoustic,
# ergonomic." Listed there as prose, not a formal taxonomy in V1 -- this is
# the first time it becomes a governed OntologyScheme, not a re-derivation
# of an existing V1 enum.
scheme:
  name: "Energy Source"
  description: "Energy types present in a hazard's exposure pathway -- classifies safety.hazards.energy_source_concept_id."

concepts:
